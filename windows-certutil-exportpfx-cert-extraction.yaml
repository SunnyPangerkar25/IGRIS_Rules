# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Windows - AD CS Certificate Extraction via certutil -exportPFX"
enabled: true
description: |
  Detects extraction of a private key and certificate to a PFX file via
  certutil.exe -exportPFX. Triggers on Windows Security EventID 4688 when
  certutil.exe is invoked with the -exportPFX argument. -exportPFX is a
  Microsoft-documented option for dumping certificates with their private
  keys; it is used by adversaries to steal AD Certificate Services
  enrollment certificates, code-signing keys, or stored authentication
  certificates for impersonation or persistence (T1649).

# UC#: 60
# poc_build: true
# primary_platform: CrowdStrike Falcon EDR
# reason: EDR provides parent-child attribution and full command-line plus file-write context.
#   Built here because logging is available - re-evaluate post-POC.
# raw_field_rule: true
# raw_field_reason: 4688 is Category B (Windows partial OCSF mapping; process-creation events
#   not OCSF-mapped).
# MITRE ATT&CK: T1649 - Steal or Forge Authentication Certificates (TA0006 - Credential Access)
# Log Source: Windows Security (ocsf_mapped via raw_data path - Category B raw-field rule)
# TI Source: SigmaHQ - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_certutil_export_pfx.yml
# UWS Encyclopedia: https://www.ultimatewindowssecurity.com/securitylog/encyclopedia/event.aspx?eventid=4688
# Field positions verified live:
#   [1]=SubjectUserName, [5]=NewProcessName, [8]=CommandLine, [13]=ParentProcessName

severity: High
query_text: |
  @index={ 81fe91d5-1dee-4321-8700-0d1c4f441770 | "ocsf_mapped" }
  metadata.labels[1] = "WINDOWS"
  raw_data.%json.EventID = 4688
  raw_data.%json.StringInserts[5] = "*\\certutil.exe"
  (raw_data.%json.StringInserts[8] = "*-exportPFX*"
   OR raw_data.%json.StringInserts[8] = "*/exportPFX*"
   OR raw_data.%json.StringInserts[8] = "*-exportpfx*"
   OR raw_data.%json.StringInserts[8] = "*/exportpfx*")
  | stats count() as event_count
    by ig_tenant_id,
       %ingest.import_rule_name,
       raw_data.%json.hostname,
       raw_data.%json.StringInserts[1],
       raw_data.%json.StringInserts[5],
       raw_data.%json.StringInserts[8],
       raw_data.%json.StringInserts[13]
  | where(event_count >= 1)
  | rename(raw_data.%json.hostname as hostname,
           raw_data.%json.StringInserts[1] as subject_user,
           raw_data.%json.StringInserts[5] as new_process_name,
           raw_data.%json.StringInserts[8] as command_line,
           raw_data.%json.StringInserts[13] as parent_process_name)

tags:
  - techniques.t1649.t1649

time_range_s: 3600
run_frequency_s: 300
dedup_window_s: 86400
debounce: true
alert_per_row: false

alert_template:
  info:
    - label: "detectionid"
      value: "{{@alert.id}}"
      use_for_dedup: false
    - label: "incident_type"
      value: "Credential Access"
      use_for_dedup: false
    - label: "incident_subtype"
      value: "Certificate Extraction via certutil -exportPFX"
      use_for_dedup: false
    - label: "ruleid"
      value: "{{@alert.detection_rule_id}}"
      use_for_dedup: false
    - label: "incident_key"
      value: "hostname"
      use_for_dedup: false
    - label: "hostname"
      value: "{{@alert.results_table.rows[0].hostname}}"
      use_for_dedup: true

tests:
  - name: "Positive - certutil -exportPFX (dump certificate with private key)"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:01:00.000Z","metadata.labels[1]":"WINDOWS","raw_data.%json.EventID":4688,"raw_data.%json.hostname":"DC01","raw_data.%json.StringInserts[1]":"attacker","raw_data.%json.StringInserts[5]":"C:\\Windows\\System32\\certutil.exe","raw_data.%json.StringInserts[8]":"certutil.exe -exportPFX -p \"pass123\" My ABCDEF1234 C:\\Users\\Public\\dump.pfx","raw_data.%json.StringInserts[13]":"C:\\Windows\\System32\\cmd.exe","ig_tenant_id":"c4134177-2fae-4a1a-8bb5-c81e997f78e5","%ingest.import_rule_name":"base_event"}
    expected_detection_result: true

  - name: "Positive - certutil /exportpfx lowercase forward-slash variant"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:01:00.000Z","metadata.labels[1]":"WINDOWS","raw_data.%json.EventID":4688,"raw_data.%json.hostname":"WS02","raw_data.%json.StringInserts[1]":"attacker","raw_data.%json.StringInserts[5]":"C:\\Windows\\System32\\certutil.exe","raw_data.%json.StringInserts[8]":"certutil /exportpfx -user My C:\\Users\\Public\\stolen.pfx","raw_data.%json.StringInserts[13]":"C:\\Windows\\System32\\powershell.exe","ig_tenant_id":"c4134177-2fae-4a1a-8bb5-c81e997f78e5","%ingest.import_rule_name":"base_event"}
    expected_detection_result: true

  - name: "Negative - certutil with unrelated argument (e.g. -store)"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:01:00.000Z","metadata.labels[1]":"WINDOWS","raw_data.%json.EventID":4688,"raw_data.%json.hostname":"HOST03","raw_data.%json.StringInserts[1]":"admin","raw_data.%json.StringInserts[5]":"C:\\Windows\\System32\\certutil.exe","raw_data.%json.StringInserts[8]":"certutil -store My","raw_data.%json.StringInserts[13]":"C:\\Windows\\System32\\cmd.exe","ig_tenant_id":"c4134177-2fae-4a1a-8bb5-c81e997f78e5","%ingest.import_rule_name":"base_event"}
    expected_detection_result: false

  - name: "Negative - Different process (not certutil)"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:01:00.000Z","metadata.labels[1]":"WINDOWS","raw_data.%json.EventID":4688,"raw_data.%json.hostname":"HOST04","raw_data.%json.StringInserts[1]":"admin","raw_data.%json.StringInserts[5]":"C:\\Windows\\System32\\certreq.exe","raw_data.%json.StringInserts[8]":"certreq.exe -submit -config CA1 request.req cert.cer","raw_data.%json.StringInserts[13]":"C:\\Windows\\System32\\cmd.exe","ig_tenant_id":"c4134177-2fae-4a1a-8bb5-c81e997f78e5","%ingest.import_rule_name":"base_event"}
    expected_detection_result: false
