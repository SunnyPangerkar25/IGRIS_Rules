# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Windows - Password-Protected ZIP File Opened"
enabled: true
description: |
  Detects opening of password-protected ZIP archives via Windows Shell. Triggers on
  Windows Security EventID 5379 (Credential Manager credentials were read) where the
  read target matches the Shell-ZIP-decryption pattern
  (TargetName contains 'Microsoft_Windows_Shell_ZipFolder:filename'). Password-
  protected archives are commonly used by malware delivery to bypass AV inspection.
  Excludes Outlook attachment caching paths (Content.Outlook) which generate benign
  5379 events from preview pane operations.

# UC#: 16
# MITRE ATT&CK: T1027 - Obfuscated Files or Information (TA0005 - Defense Evasion)
# OCSF Class: User Access Management
# Log Source: Windows Security (ocsf_mapped)
# TI Source: SigmaHQ - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_susp_opened_encrypted_zip.yml
# Field positions verified live:
#   [0]=SubjectUserSid, [1]=SubjectUserName, [2]=SubjectDomainName, [3]=SubjectLogonId,
#   [4]=TargetName (the Credential Manager target — Shell ZipFolder pattern indicates ZIP open)

severity: Medium
query_text: |
  @index={ 81fe91d5-1dee-4321-8700-0d1c4f441770 | "ocsf_mapped" }
  metadata.labels[1] = "WINDOWS"
  metadata.event_code = 5379
  unmapped.StringInserts.%json[4]: "Microsoft_Windows_Shell_ZipFolder:filename"
  not unmapped.StringInserts.%json[4]: "Content.Outlook"
  | stats count() as event_count
    by ig_tenant_id,
       %ingest.import_rule_name,
       actor.user.name,
       unmapped.StringInserts.%json[1],
       unmapped.StringInserts.%json[4]
  | where(event_count >= 1)
  | rename(actor.user.name as username,
           unmapped.StringInserts.%json[1] as subject_user,
           unmapped.StringInserts.%json[4] as target_name)

tags:
  - techniques.t1027.t1027

time_range_s: 3600
run_frequency_s: 300
dedup_window_s: 86400
debounce: true
alert_per_row: false

alert_template:
  info:
    - label: "detectionid"
      value: "{{@alert.id}}"
      use_for_dedup: false
    - label: "incident_type"
      value: "Defense Evasion"
      use_for_dedup: false
    - label: "incident_subtype"
      value: "Password-Protected Archive Opened"
      use_for_dedup: false
    - label: "ruleid"
      value: "{{@alert.detection_rule_id}}"
      use_for_dedup: false
    - label: "incident_key"
      value: "username"
      use_for_dedup: false
    - label: "username"
      value: "{{@alert.results_table.rows[0].username}}"
      use_for_dedup: true

tests:
  - name: "Positive - Password-protected ZIP opened via Windows Shell"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:01:00.000Z","metadata.labels[1]":"WINDOWS","metadata.event_code":5379,"actor.user.name":"jdoe","unmapped.StringInserts.%json[0]":"S-1-5-21-12345-67890-1","unmapped.StringInserts.%json[1]":"jdoe","unmapped.StringInserts.%json[2]":"CORP","unmapped.StringInserts.%json[3]":"0x12345","unmapped.StringInserts.%json[4]":"Microsoft_Windows_Shell_ZipFolder:filename=C:\\Users\\jdoe\\Downloads\\invoice.zip","ig_tenant_id":"test-tenant","%ingest.import_rule_name":"base_event"}
    expected_detection_result: true

  - name: "Negative - 5379 for benign Credential Manager read (WindowsLive token)"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:01:00.000Z","metadata.labels[1]":"WINDOWS","metadata.event_code":5379,"actor.user.name":"RRLVSBCKSRV$","unmapped.StringInserts.%json[0]":"S-1-5-18","unmapped.StringInserts.%json[1]":"RRLVSBCKSRV$","unmapped.StringInserts.%json[2]":"CORP","unmapped.StringInserts.%json[3]":"0x3e7","unmapped.StringInserts.%json[4]":"WindowsLive:(token):name=02zyhfnexmqqhsfz;serviceuri=*","ig_tenant_id":"test-tenant","%ingest.import_rule_name":"base_event"}
    expected_detection_result: false

  - name: "Negative - ZIP open from Outlook attachment cache (excluded)"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:01:00.000Z","metadata.labels[1]":"WINDOWS","metadata.event_code":5379,"actor.user.name":"jdoe","unmapped.StringInserts.%json[0]":"S-1-5-21-12345-67890-1","unmapped.StringInserts.%json[1]":"jdoe","unmapped.StringInserts.%json[2]":"CORP","unmapped.StringInserts.%json[3]":"0x12345","unmapped.StringInserts.%json[4]":"Microsoft_Windows_Shell_ZipFolder:filename=C:\\Users\\jdoe\\AppData\\Local\\Microsoft\\Windows\\Temporary Internet Files\\Content.Outlook\\ABC123\\attach.zip","ig_tenant_id":"test-tenant","%ingest.import_rule_name":"base_event"}
    expected_detection_result: false
