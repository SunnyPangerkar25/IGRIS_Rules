# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Windows - vaultcmd Credential Extraction"
enabled: true
description: |
  Detects credential extraction via vaultcmd.exe, a built-in Windows binary
  used to manage stored credentials in the Windows Credential Manager
  (Credential Vault). Triggers on Windows Security EventID 4688 when
  vaultcmd.exe is invoked with /listcreds: (enumerate stored credentials)
  or /list (list all vaults). These flags are abused by adversaries to
  harvest browser-saved web credentials, mapped-drive credentials, and
  RDP/SMB cached credentials without dropping any tooling on disk.

# UC#: 28
# poc_build: true
# primary_platform: CrowdStrike Falcon EDR
# reason: EDR provides parent-child process attribution and richer command-line context.
#   Built here because logging is available - re-evaluate post-POC.
# raw_field_rule: true
# raw_field_reason: 4688 is Category B (Windows partial OCSF mapping; process-creation events
#   not OCSF-mapped).
# MITRE ATT&CK: T1555.004 - Credentials from Password Stores: Windows Credential Manager (TA0006 - Credential Access)
# Log Source: Windows Security (ocsf_mapped via raw_data path - Category B raw-field rule)
# TI Source: SigmaHQ - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_vaultcmd_discovery_credentials.yml
# UWS Encyclopedia: https://www.ultimatewindowssecurity.com/securitylog/encyclopedia/event.aspx?eventid=4688
# Field positions verified live:
#   [1]=SubjectUserName, [5]=NewProcessName, [8]=CommandLine, [13]=ParentProcessName

severity: High
query_text: |
  @index={ 81fe91d5-1dee-4321-8700-0d1c4f441770 | "ocsf_mapped" }
  metadata.labels[1] = "WINDOWS"
  raw_data.%json.EventID = 4688
  raw_data.%json.StringInserts[5] = "*\\vaultcmd.exe"
  (raw_data.%json.StringInserts[8] = "*/listcreds:*"
   OR raw_data.%json.StringInserts[8] = "*/list*")
  | stats count() as event_count
    by ig_tenant_id,
       %ingest.import_rule_name,
       raw_data.%json.hostname,
       raw_data.%json.StringInserts[1],
       raw_data.%json.StringInserts[5],
       raw_data.%json.StringInserts[8],
       raw_data.%json.StringInserts[13]
  | where(event_count >= 1)
  | rename(raw_data.%json.hostname as hostname,
           raw_data.%json.StringInserts[1] as subject_user,
           raw_data.%json.StringInserts[5] as new_process_name,
           raw_data.%json.StringInserts[8] as command_line,
           raw_data.%json.StringInserts[13] as parent_process_name)

tags:
  - techniques.t1555.004.t1555_004

time_range_s: 3600
run_frequency_s: 300
dedup_window_s: 86400
debounce: true
alert_per_row: false

alert_template:
  info:
    - label: "detectionid"
      value: "{{@alert.id}}"
      use_for_dedup: false
    - label: "incident_type"
      value: "Credential Access"
      use_for_dedup: false
    - label: "incident_subtype"
      value: "Credential Manager Extraction via vaultcmd"
      use_for_dedup: false
    - label: "ruleid"
      value: "{{@alert.detection_rule_id}}"
      use_for_dedup: false
    - label: "incident_key"
      value: "hostname"
      use_for_dedup: false
    - label: "hostname"
      value: "{{@alert.results_table.rows[0].hostname}}"
      use_for_dedup: true

tests:
  - name: "Positive - vaultcmd /listcreds: (enumerate stored creds)"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:01:00.000Z","metadata.labels[1]":"WINDOWS","raw_data.%json.EventID":4688,"raw_data.%json.hostname":"HOST01","raw_data.%json.StringInserts[1]":"attacker","raw_data.%json.StringInserts[5]":"C:\\Windows\\System32\\vaultcmd.exe","raw_data.%json.StringInserts[8]":"vaultcmd /listcreds:\"Windows Credentials\"","raw_data.%json.StringInserts[13]":"C:\\Windows\\System32\\cmd.exe","ig_tenant_id":"c4134177-2fae-4a1a-8bb5-c81e997f78e5","%ingest.import_rule_name":"base_event"}
    expected_detection_result: true

  - name: "Positive - vaultcmd /list (list vaults)"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:01:00.000Z","metadata.labels[1]":"WINDOWS","raw_data.%json.EventID":4688,"raw_data.%json.hostname":"HOST02","raw_data.%json.StringInserts[1]":"attacker","raw_data.%json.StringInserts[5]":"C:\\Windows\\System32\\vaultcmd.exe","raw_data.%json.StringInserts[8]":"vaultcmd /list","raw_data.%json.StringInserts[13]":"C:\\Windows\\System32\\powershell.exe","ig_tenant_id":"c4134177-2fae-4a1a-8bb5-c81e997f78e5","%ingest.import_rule_name":"base_event"}
    expected_detection_result: true

  - name: "Negative - vaultcmd with unrelated argument (no credential-extraction flag)"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:01:00.000Z","metadata.labels[1]":"WINDOWS","raw_data.%json.EventID":4688,"raw_data.%json.hostname":"HOST03","raw_data.%json.StringInserts[1]":"admin","raw_data.%json.StringInserts[5]":"C:\\Windows\\System32\\vaultcmd.exe","raw_data.%json.StringInserts[8]":"vaultcmd /?","raw_data.%json.StringInserts[13]":"C:\\Windows\\System32\\cmd.exe","ig_tenant_id":"c4134177-2fae-4a1a-8bb5-c81e997f78e5","%ingest.import_rule_name":"base_event"}
    expected_detection_result: false

  - name: "Negative - Different process (not vaultcmd)"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:01:00.000Z","metadata.labels[1]":"WINDOWS","raw_data.%json.EventID":4688,"raw_data.%json.hostname":"HOST04","raw_data.%json.StringInserts[1]":"admin","raw_data.%json.StringInserts[5]":"C:\\Windows\\System32\\cmdkey.exe","raw_data.%json.StringInserts[8]":"cmdkey /list","raw_data.%json.StringInserts[13]":"C:\\Windows\\System32\\cmd.exe","ig_tenant_id":"c4134177-2fae-4a1a-8bb5-c81e997f78e5","%ingest.import_rule_name":"base_event"}
    expected_detection_result: false
