# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Windows - Account Tampering via Suspicious Failed Logon Codes"
enabled: true
description: |
  Detects failed logon attempts that return uncommon status codes indicating an
  account has been deliberately restricted or tampered with. Triggers on Windows
  Security EventID 4625 (failed logon, SubStatus field) or EventID 4776 (NTLM
  credential validation, error code field) where the code is one of:
  0xC0000072 (account disabled), 0xC000006F (logon outside authorized hours),
  0xC0000070 (workstation restriction violated), 0xC0000193 (account expired),
  0xC000018C (trust relationship failed), or 0xC000015B (logon type not
  granted). These codes appear when an attacker tries credentials against an
  account whose state has been intentionally changed - a discovery signal that
  an attacker has prior knowledge of credentials but does not know the current
  account state.

# UC#: 31
# MITRE ATT&CK: T1078 - Valid Accounts (TA0001 - Initial Access)
# OCSF Class: Authentication (3002)
# Log Source: Windows Security (ocsf_mapped)
# TI Source: SigmaHQ - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_susp_failed_logon_reasons.yml
# UWS Encyclopedia: https://www.ultimatewindowssecurity.com/securitylog/encyclopedia/event.aspx?eventid=4625
#                   https://www.ultimatewindowssecurity.com/securitylog/encyclopedia/event.aspx?eventid=4776
# Field positions verified live:
#   4625: [0]=SubjectSid, [5]=TargetUserName, [6]=TargetDomain, [7]=Status,
#         [8]=FailureReason, [9]=SubStatus (THIS IS THE FILTER FIELD), [10]=LogonType
#   4776: [0]=AuthPackage, [1]=Workstation (source), [2]=LogonAccount,
#         [3]=ErrorCode (THIS IS THE FILTER FIELD)

severity: High
query_text: |
  @index={ 81fe91d5-1dee-4321-8700-0d1c4f441770 | "ocsf_mapped" }
  metadata.labels[1] = "WINDOWS"
  ((metadata.event_code = 4625 AND
    (unmapped.StringInserts.%json[9] = "0xC0000072" or
     unmapped.StringInserts.%json[9] = "0xC000006F" or
     unmapped.StringInserts.%json[9] = "0xC0000070" or
     unmapped.StringInserts.%json[9] = "0xC0000193" or
     unmapped.StringInserts.%json[9] = "0xC000018C" or
     unmapped.StringInserts.%json[9] = "0xC000015B"))
   OR
   (metadata.event_code = 4776 AND
    (unmapped.StringInserts.%json[3] = "0xC0000072" or
     unmapped.StringInserts.%json[3] = "0xC000006F" or
     unmapped.StringInserts.%json[3] = "0xC0000070" or
     unmapped.StringInserts.%json[3] = "0xC0000193" or
     unmapped.StringInserts.%json[3] = "0xC000018C" or
     unmapped.StringInserts.%json[3] = "0xC000015B")))
  not unmapped.StringInserts.%json[0] = "S-1-0-0"
  | stats count() as event_count
    by ig_tenant_id,
       %ingest.import_rule_name,
       metadata.event_code,
       src_endpoint.ip,
       unmapped.StringInserts.%json[3],
       unmapped.StringInserts.%json[5],
       unmapped.StringInserts.%json[9]
  | where(event_count >= 1)
  | rename(src_endpoint.ip as source_ip,
           unmapped.StringInserts.%json[3] as code_4776,
           unmapped.StringInserts.%json[5] as target_user_4625,
           unmapped.StringInserts.%json[9] as sub_status_4625)

tags:
  - techniques.t1078.t1078

time_range_s: 3600
run_frequency_s: 300
dedup_window_s: 86400
debounce: true
alert_per_row: false

alert_template:
  info:
    - label: "detectionid"
      value: "{{@alert.id}}"
      use_for_dedup: false
    - label: "incident_type"
      value: "Initial Access"
      use_for_dedup: false
    - label: "incident_subtype"
      value: "Account Tampering Probe"
      use_for_dedup: false
    - label: "ruleid"
      value: "{{@alert.detection_rule_id}}"
      use_for_dedup: false
    - label: "incident_key"
      value: "source_ip"
      use_for_dedup: false
    - label: "source_ip"
      value: "{{@alert.results_table.rows[0].source_ip}}"
      use_for_dedup: true

tests:
  - name: "Positive - 4625 with SubStatus 0xC000006F (logon outside hours)"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:01:00.000Z","metadata.labels[1]":"WINDOWS","metadata.event_code":4625,"src_endpoint.ip":"172.16.130.99","unmapped.StringInserts.%json[0]":"S-1-5-21-12345-67890-500","unmapped.StringInserts.%json[5]":"jdoe","unmapped.StringInserts.%json[6]":"CORP","unmapped.StringInserts.%json[7]":"0xc000006e","unmapped.StringInserts.%json[8]":"%%2310","unmapped.StringInserts.%json[9]":"0xC000006F","unmapped.StringInserts.%json[10]":3,"ig_tenant_id":"test-tenant","%ingest.import_rule_name":"authentication"}
    expected_detection_result: true

  - name: "Positive - 4776 with error code 0xC0000193 (account expired)"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:02:00.000Z","metadata.labels[1]":"WINDOWS","metadata.event_code":4776,"unmapped.StringInserts.%json[0]":"MICROSOFT_AUTHENTICATION_PACKAGE_V1_0","unmapped.StringInserts.%json[1]":"ATTACKER-PC","unmapped.StringInserts.%json[2]":"contractor.expired","unmapped.StringInserts.%json[3]":"0xC0000193","src_endpoint.ip":"172.16.130.99","ig_tenant_id":"test-tenant","%ingest.import_rule_name":"authentication"}
    expected_detection_result: true

  - name: "Negative - 4625 with bad password (0xC000006A, common typing failure)"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:01:00.000Z","metadata.labels[1]":"WINDOWS","metadata.event_code":4625,"src_endpoint.ip":"172.16.130.99","unmapped.StringInserts.%json[0]":"S-1-5-21-12345-67890-500","unmapped.StringInserts.%json[5]":"jdoe","unmapped.StringInserts.%json[6]":"CORP","unmapped.StringInserts.%json[7]":"0xc000006d","unmapped.StringInserts.%json[8]":"%%2313","unmapped.StringInserts.%json[9]":"0xC000006A","unmapped.StringInserts.%json[10]":3,"ig_tenant_id":"test-tenant","%ingest.import_rule_name":"authentication"}
    expected_detection_result: false

  - name: "Negative - 4625 disabled-account substatus with NULL SubjectSid (excluded)"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:01:00.000Z","metadata.labels[1]":"WINDOWS","metadata.event_code":4625,"src_endpoint.ip":"172.16.130.99","unmapped.StringInserts.%json[0]":"S-1-0-0","unmapped.StringInserts.%json[5]":"jdoe","unmapped.StringInserts.%json[6]":"CORP","unmapped.StringInserts.%json[7]":"0xc000006e","unmapped.StringInserts.%json[8]":"%%2310","unmapped.StringInserts.%json[9]":"0xC0000072","unmapped.StringInserts.%json[10]":3,"ig_tenant_id":"test-tenant","%ingest.import_rule_name":"authentication"}
    expected_detection_result: false
