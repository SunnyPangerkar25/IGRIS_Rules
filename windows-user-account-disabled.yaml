# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Windows - User Account Disabled"
enabled: true
description: |
  Detects when a Windows user account is disabled. Triggers on Windows Security
  EventID 4725 (a user account was disabled). Atomic single-event detection -
  every account disablement generates an alert for analyst review. Mass-disable
  patterns (rogue admin, lockout-style attack) are detectable downstream by
  thresholding on this alert volume.

# UC#: 56
# MITRE ATT&CK: T1531 - Account Access Removal (TA0040 - Impact)
# OCSF Class: Account Change
# Log Source: Windows Security (ocsf_mapped)
# TI Source: Splunk Security Content - https://research.splunk.com/endpoint/5d93894e-befa-4429-abde-7fc541020b7b/
# Field positions verified live:
#   [0]=TargetUserName, [1]=TargetDomainName, [2]=TargetSid,
#   [3]=SubjectUserSid, [4]=SubjectUserName

severity: Medium
query_text: |
  @index={ 81fe91d5-1dee-4321-8700-0d1c4f441770 | "ocsf_mapped" }
  metadata.labels[1] = "WINDOWS"
  metadata.event_code = 4725
  | stats count() as event_count
    by ig_tenant_id,
       %ingest.import_rule_name,
       actor.user.name,
       unmapped.StringInserts.%json[0],
       unmapped.StringInserts.%json[2]
  | where(event_count >= 1)
  | rename(actor.user.name as disabled_by,
           unmapped.StringInserts.%json[0] as target_user,
           unmapped.StringInserts.%json[2] as target_sid)

tags:
  - techniques.t1531.t1531

time_range_s: 3600
run_frequency_s: 300
dedup_window_s: 86400
debounce: true
alert_per_row: false

alert_template:
  info:
    - label: "detectionid"
      value: "{{@alert.id}}"
      use_for_dedup: false
    - label: "incident_type"
      value: "Account Management"
      use_for_dedup: false
    - label: "incident_subtype"
      value: "User Account Disabled"
      use_for_dedup: false
    - label: "ruleid"
      value: "{{@alert.detection_rule_id}}"
      use_for_dedup: false
    - label: "incident_key"
      value: "target_user"
      use_for_dedup: false
    - label: "target_user"
      value: "{{@alert.results_table.rows[0].target_user}}"
      use_for_dedup: true

tests:
  - name: "Positive - User account disabled"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:01:00.000Z","metadata.labels[1]":"WINDOWS","metadata.event_code":4725,"actor.user.name":"Administrator","unmapped.StringInserts.%json[0]":"002910","unmapped.StringInserts.%json[1]":"CORP","unmapped.StringInserts.%json[2]":"S-1-5-21-12345-67890-11604","unmapped.StringInserts.%json[3]":"S-1-5-21-12345-67890-500","unmapped.StringInserts.%json[4]":"Administrator","ig_tenant_id":"test-tenant","%ingest.import_rule_name":"base_event"}
    expected_detection_result: true

  - name: "Negative - 4720 user created (not disabled)"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:01:00.000Z","metadata.labels[1]":"WINDOWS","metadata.event_code":4720,"actor.user.name":"Administrator","unmapped.StringInserts.%json[0]":"newuser","unmapped.StringInserts.%json[1]":"CORP","unmapped.StringInserts.%json[2]":"S-1-5-21-12345-67890-9999","unmapped.StringInserts.%json[3]":"S-1-5-21-12345-67890-500","unmapped.StringInserts.%json[4]":"Administrator","ig_tenant_id":"test-tenant","%ingest.import_rule_name":"base_event"}
    expected_detection_result: false
