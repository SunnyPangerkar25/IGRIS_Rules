# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Windows - Multiple User Accounts Created (Burst)"
enabled: true
description: |
  Detects bursts of new local/domain user account creation on a single host or
  by a single actor within a 1-hour window. Triggers on Windows Security
  EventID 4720 (a user account was created) where the same SubjectUserName
  (creator account) generates 3 or more distinct TargetUserName values within
  the window. Single account creation is routine admin activity; a burst of
  3+ created accounts from one actor in one hour is anomalous and indicates
  potential post-compromise persistence (attacker creating multiple backdoor
  accounts).

# UC#: 44
# MITRE ATT&CK: T1136.001 - Create Account: Local Account (TA0003 - Persistence)
# OCSF Class: Account Change
# Log Source: Windows Security (ocsf_mapped)
# TI Source: Splunk Security Content - https://research.splunk.com/endpoint/3fb2e8e3-7bc0-4567-9722-c5ab9f8595eb/
# UWS Encyclopedia: https://www.ultimatewindowssecurity.com/securitylog/encyclopedia/event.aspx?eventid=4720
# Field positions verified live:
#   [0]=TargetUserName, [1]=TargetDomainName, [2]=TargetSid,
#   [3]=SubjectUserSid, [4]=SubjectUserName

severity: High
query_text: |
  @index={ 81fe91d5-1dee-4321-8700-0d1c4f441770 | "ocsf_mapped" }
  metadata.labels[1] = "WINDOWS"
  metadata.event_code = 4720
  | stats
    countdistinct(unmapped.StringInserts.%json[0]) as unique_accounts_created,
    count() as total_creations
    by ig_tenant_id,
       %ingest.import_rule_name,
       actor.user.name,
       unmapped.StringInserts.%json[4]
  | where(unique_accounts_created >= 3)
  | rename(actor.user.name as created_by_mapped,
           unmapped.StringInserts.%json[4] as created_by_raw)

tags:
  - techniques.t1136.001.t1136_001

time_range_s: 3600
run_frequency_s: 300
dedup_window_s: 86400
debounce: true
alert_per_row: false

alert_template:
  info:
    - label: "detectionid"
      value: "{{@alert.id}}"
      use_for_dedup: false
    - label: "incident_type"
      value: "Persistence"
      use_for_dedup: false
    - label: "incident_subtype"
      value: "Multiple Account Creation Burst"
      use_for_dedup: false
    - label: "ruleid"
      value: "{{@alert.detection_rule_id}}"
      use_for_dedup: false
    - label: "incident_key"
      value: "created_by_raw"
      use_for_dedup: false
    - label: "created_by_raw"
      value: "{{@alert.results_table.rows[0].created_by_raw}}"
      use_for_dedup: true

tests:
  - name: "Positive - 3 distinct user creations by same admin in 1hr"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:01:00.000Z","metadata.labels[1]":"WINDOWS","metadata.event_code":4720,"actor.user.name":"Administrator","unmapped.StringInserts.%json[0]":"backdoor1","unmapped.StringInserts.%json[1]":"CORP","unmapped.StringInserts.%json[2]":"S-1-5-21-12345-67890-1001","unmapped.StringInserts.%json[3]":"S-1-5-21-12345-67890-500","unmapped.StringInserts.%json[4]":"Administrator","ig_tenant_id":"test-tenant","%ingest.import_rule_name":"base_event"}
      {"timestamp":"2026-05-13T12:03:00.000Z","metadata.labels[1]":"WINDOWS","metadata.event_code":4720,"actor.user.name":"Administrator","unmapped.StringInserts.%json[0]":"backdoor2","unmapped.StringInserts.%json[1]":"CORP","unmapped.StringInserts.%json[2]":"S-1-5-21-12345-67890-1002","unmapped.StringInserts.%json[3]":"S-1-5-21-12345-67890-500","unmapped.StringInserts.%json[4]":"Administrator","ig_tenant_id":"test-tenant","%ingest.import_rule_name":"base_event"}
      {"timestamp":"2026-05-13T12:05:00.000Z","metadata.labels[1]":"WINDOWS","metadata.event_code":4720,"actor.user.name":"Administrator","unmapped.StringInserts.%json[0]":"backdoor3","unmapped.StringInserts.%json[1]":"CORP","unmapped.StringInserts.%json[2]":"S-1-5-21-12345-67890-1003","unmapped.StringInserts.%json[3]":"S-1-5-21-12345-67890-500","unmapped.StringInserts.%json[4]":"Administrator","ig_tenant_id":"test-tenant","%ingest.import_rule_name":"base_event"}
    expected_detection_result: true

  - name: "Negative - Single user creation (below threshold)"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:01:00.000Z","metadata.labels[1]":"WINDOWS","metadata.event_code":4720,"actor.user.name":"Administrator","unmapped.StringInserts.%json[0]":"newhire","unmapped.StringInserts.%json[1]":"CORP","unmapped.StringInserts.%json[2]":"S-1-5-21-12345-67890-1001","unmapped.StringInserts.%json[3]":"S-1-5-21-12345-67890-500","unmapped.StringInserts.%json[4]":"Administrator","ig_tenant_id":"test-tenant","%ingest.import_rule_name":"base_event"}
    expected_detection_result: false

  - name: "Negative - 3 creations but by different admins (no single-actor burst)"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:01:00.000Z","metadata.labels[1]":"WINDOWS","metadata.event_code":4720,"actor.user.name":"admin1","unmapped.StringInserts.%json[0]":"user1","unmapped.StringInserts.%json[1]":"CORP","unmapped.StringInserts.%json[2]":"S-1-5-21-12345-67890-1001","unmapped.StringInserts.%json[3]":"S-1-5-21-12345-67890-500","unmapped.StringInserts.%json[4]":"admin1","ig_tenant_id":"test-tenant","%ingest.import_rule_name":"base_event"}
      {"timestamp":"2026-05-13T12:03:00.000Z","metadata.labels[1]":"WINDOWS","metadata.event_code":4720,"actor.user.name":"admin2","unmapped.StringInserts.%json[0]":"user2","unmapped.StringInserts.%json[1]":"CORP","unmapped.StringInserts.%json[2]":"S-1-5-21-12345-67890-1002","unmapped.StringInserts.%json[3]":"S-1-5-21-12345-67890-501","unmapped.StringInserts.%json[4]":"admin2","ig_tenant_id":"test-tenant","%ingest.import_rule_name":"base_event"}
      {"timestamp":"2026-05-13T12:05:00.000Z","metadata.labels[1]":"WINDOWS","metadata.event_code":4720,"actor.user.name":"admin3","unmapped.StringInserts.%json[0]":"user3","unmapped.StringInserts.%json[1]":"CORP","unmapped.StringInserts.%json[2]":"S-1-5-21-12345-67890-1003","unmapped.StringInserts.%json[3]":"S-1-5-21-12345-67890-502","unmapped.StringInserts.%json[4]":"admin3","ig_tenant_id":"test-tenant","%ingest.import_rule_name":"base_event"}
    expected_detection_result: false
