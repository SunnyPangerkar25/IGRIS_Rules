# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Windows - Privileged Group Membership Change via AD Object Modification (5136)"
enabled: true
description: |
  Detects modification of the member attribute on a high-privilege Active
  Directory group object (Domain Admins, Enterprise Admins, Schema Admins,
  Administrators, Account Operators, Server Operators, Backup Operators, or
  DnsAdmins) via directory service object modification auditing. Fires on a
  single occurrence and reports whether the member was added or removed.
  Provides an independent, second audit trail for privileged group membership
  changes: it is generated by Directory Service Changes auditing, a separate
  subcategory from Security Group Management, so coverage survives tampering
  or misconfiguration of group-management auditing, and a single rule covers
  global, domain-local, and universal group scopes.

# MITRE ATT&CK: T1098 - Account Manipulation (TA0003 - Persistence, TA0004 - Privilege Escalation)
# MITRE ATT&CK: T1562.002 - Impair Defenses: Disable Windows Event Logging (coverage rationale - backstop trail)
# OCSF Class: Base Event (0) - unmapped Windows feed
# Log Source: Windows Security (ocsf_mapped, raw_data.%json.* feed)
# TI Source: Build from data + Microsoft Security Auditing schema (UWS Encyclopedia)
# Reference: https://www.ultimatewindowssecurity.com/securitylog/encyclopedia/event.aspx?eventid=5136
#
# Event 5136 = a directory service object was modified. Scoped here to:
#   AttributeLDAPDisplayName = "member" on privileged-group ObjectDNs -> membership change.
#   OperationType %%14674 = Value Added (member added), %%14675 = Value Deleted (member removed).
#
# Field positions (raw_data.%json.StringInserts) for 5136 - VERIFIED against live tenant data:
#   [0]=OpCorrelationID  [1]=AppCorrelationID  [2]=SubjectUserSid  [3]=SubjectUserName(performed_by)
#   [4]=SubjectDomainName  [5]=SubjectLogonId  [6]=DSName  [7]=DSType  [8]=ObjectDN
#   [9]=ObjectGUID  [10]=ObjectClass  [11]=AttributeLDAPDisplayName  [12]=AttributeSyntaxOID
#   [13]=AttributeValue(member DN)  [14]=OperationType
#   NOTE: this layout differs from the 472x/475x family AND from the mapped-feed 5136 layout
#   (raw feed includes two correlation IDs at the front).
#
# Critical groups matched by DN token phrase on [8] (name-based; covers all group scopes and
#   custom-RID groups like DnsAdmins that have no well-known SID):
#   Domain Admins | Enterprise Admins | Schema Admins | CN=Administrators
#   Account Operators | Server Operators | Backup Operators | DnsAdmins
# ObjectClass [10] intentionally NOT filtered (member attribute only exists on group objects;
#   avoids silent breakage if the parser emits a different class string).
#
# Defense-in-depth note: a real membership change fires BOTH the per-EventID 472x/475x rule and
#   this rule (two independent audit subcategories). Both use incident_key=member so downstream
#   correlation can merge them. Dual-trail verified live: Account Operators add/remove generated
#   matching 4732/4733 and 5136 member events.
# Flood Check: 4-week tenant baseline = ~6 admin-group member events (all Account Operators).
#   Near-silent, high-signal.
# Per-rule exceptions: add `and not (...)` clauses to the filter block for authorized accounts.
#
# raw_field_rule: true
# raw_category: B
# justification: Windows EventID 5136 arrives as Base Event in the current Windows OCSF mapping; ObjectDN, attribute name and operation type are only available via raw_data.%json paths
# affected_event_types: windows.5136
# migration_target: Entity Management - if Windows gains full OCSF support
severity: Critical
query_text: |
  @index={ 81fe91d5-1dee-4321-8700-0d1c4f441770 | "ocsf_mapped" }
  ig_tenant_id = "c4134177-2fae-4a1a-8bb5-c81e997f78e5"
  metadata.labels[1] = "WINDOWS"
  raw_data.%json.EventID = 5136
  raw_data.%json.StringInserts[11] = "member"
  (raw_data.%json.StringInserts[8]: "Domain Admins" or
   raw_data.%json.StringInserts[8]: "Enterprise Admins" or
   raw_data.%json.StringInserts[8]: "Schema Admins" or
   raw_data.%json.StringInserts[8]: "CN=Administrators" or
   raw_data.%json.StringInserts[8]: "Account Operators" or
   raw_data.%json.StringInserts[8]: "Server Operators" or
   raw_data.%json.StringInserts[8]: "Backup Operators" or
   raw_data.%json.StringInserts[8]: "DnsAdmins")
  | stats count() as event_count
    by ig_tenant_id,
       %ingest.import_rule_name,
       raw_data.%json.Computer,
       raw_data.%json.StringInserts[8],
       raw_data.%json.StringInserts[14],
       raw_data.%json.StringInserts[13],
       raw_data.%json.StringInserts[3]
  | where(event_count >= 1)
  | rename(raw_data.%json.Computer as hostname,
           raw_data.%json.StringInserts[8] as group_dn,
           raw_data.%json.StringInserts[14] as operation_type,
           raw_data.%json.StringInserts[13] as member,
           raw_data.%json.StringInserts[3] as performed_by)

tags:
  - techniques.t1098.t1098

time_range_s: 3600
run_frequency_s: 300
dedup_window_s: 3600
debounce: true
alert_per_row: false

alert_template:
  info:
    - label: "detectionid"
      value: "{{@alert.id}}"
      use_for_dedup: false
    - label: "incident_type"
      value: "Privilege Escalation"
      use_for_dedup: false
    - label: "incident_subtype"
      value: "Privileged Group Membership Change (AD Object Modification)"
      use_for_dedup: false
    - label: "ruleid"
      value: "{{@alert.detection_rule_id}}"
      use_for_dedup: false
    - label: "incident_key"
      value: "member"
      use_for_dedup: false
    - label: "member"
      value: "{{@alert.results_table.rows[0].member}}"
      use_for_dedup: true

tests:
  - name: "Positive - member added to Account Operators via 5136 (%%14674)"
    now_timestamp: "2026-06-04T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-06-04T12:01:00.000Z","metadata.labels[1]":"WINDOWS","raw_data.%json.EventID":5136,"raw_data.%json.Computer":"DC01.example.local","raw_data.%json.StringInserts[3]":"admin.user","raw_data.%json.StringInserts[8]":"CN=Account Operators,CN=Builtin,DC=example,DC=local","raw_data.%json.StringInserts[10]":"group","raw_data.%json.StringInserts[11]":"member","raw_data.%json.StringInserts[13]":"CN=Jane Doe,OU=Users,DC=example,DC=local","raw_data.%json.StringInserts[14]":"%%14674","ig_tenant_id":"c4134177-2fae-4a1a-8bb5-c81e997f78e5","%ingest.import_rule_name":"base_event"}
    expected_detection_result: true

  - name: "Positive - member removed from Domain Admins via 5136 (%%14675)"
    now_timestamp: "2026-06-04T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-06-04T12:02:00.000Z","metadata.labels[1]":"WINDOWS","raw_data.%json.EventID":5136,"raw_data.%json.Computer":"DC01.example.local","raw_data.%json.StringInserts[3]":"admin.user","raw_data.%json.StringInserts[8]":"CN=Domain Admins,CN=Users,DC=example,DC=local","raw_data.%json.StringInserts[10]":"group","raw_data.%json.StringInserts[11]":"member","raw_data.%json.StringInserts[13]":"CN=Former Admin,OU=Users,DC=example,DC=local","raw_data.%json.StringInserts[14]":"%%14675","ig_tenant_id":"c4134177-2fae-4a1a-8bb5-c81e997f78e5","%ingest.import_rule_name":"base_event"}
    expected_detection_result: true

  - name: "Negative - member change on non-privileged business group"
    now_timestamp: "2026-06-04T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-06-04T12:03:00.000Z","metadata.labels[1]":"WINDOWS","raw_data.%json.EventID":5136,"raw_data.%json.Computer":"DC01.example.local","raw_data.%json.StringInserts[3]":"it.user","raw_data.%json.StringInserts[8]":"CN=WP_Quality,OU=Vasai Groups,DC=example,DC=local","raw_data.%json.StringInserts[10]":"group","raw_data.%json.StringInserts[11]":"member","raw_data.%json.StringInserts[13]":"CN=Normal User,OU=Users,DC=example,DC=local","raw_data.%json.StringInserts[14]":"%%14674","ig_tenant_id":"c4134177-2fae-4a1a-8bb5-c81e997f78e5","%ingest.import_rule_name":"base_event"}
    expected_detection_result: false

  - name: "Negative - admin-group object modified but attribute is not member (description)"
    now_timestamp: "2026-06-04T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-06-04T12:04:00.000Z","metadata.labels[1]":"WINDOWS","raw_data.%json.EventID":5136,"raw_data.%json.Computer":"DC01.example.local","raw_data.%json.StringInserts[3]":"admin.user","raw_data.%json.StringInserts[8]":"CN=Domain Admins,CN=Users,DC=example,DC=local","raw_data.%json.StringInserts[10]":"group","raw_data.%json.StringInserts[11]":"description","raw_data.%json.StringInserts[13]":"Updated description text","raw_data.%json.StringInserts[14]":"%%14674","ig_tenant_id":"c4134177-2fae-4a1a-8bb5-c81e997f78e5","%ingest.import_rule_name":"base_event"}
    expected_detection_result: false
