# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Microsoft 365 - Mass Mailbox SoftDelete (Bulk Cleanup or Evidence Hiding)"
enabled: true
description: |
  Detects when a single mailbox sees 500 or more SoftDelete or
  MoveToDeletedItems events within a one-hour window. Volumetric deletion at
  this rate is unusual for normal inbox hygiene and is consistent with
  automated cleanup, rule-based purging, or an attacker hiding evidence of
  a compromise by clearing mail.

  References:
  * https://attack.mitre.org/techniques/T1070/008/

# MITRE ATT&CK: T1070.008 - Clear Mailbox Data (TA0005 - Defense Evasion)
# OCSF Class: Email Activity (4009)
# Log Source: O365 Exchange (ocsf_mapped)
# Note: Threshold 500 calibrated against fleet volume. HardDelete parked
# separately (customer audit config gap).
severity: High

query_text: |
  @index={ 81fe91d5-1dee-4321-8700-0d1c4f441770 | "ocsf_mapped" }
  metadata.labels[1] = "O365"
  class_uid = 4009
  unmapped.Operation: ("SoftDelete" "MoveToDeletedItems")
  | stats count() as delete_count
    by ig_tenant_id, %ingest.import_rule_name, unmapped.MailboxOwnerUPN, unmapped.LogonType, unmapped.LogonUserSid
  | where(delete_count >= 500)
  | rename(unmapped.MailboxOwnerUPN as mailbox, unmapped.LogonUserSid as actor_sid, unmapped.LogonType as logon_type)

tags:
  - techniques.t1070.indicator_removal

time_range_s: 3600
run_frequency_s: 600

alert_template:
  info:
    - label: "detectionid"
      value: "{{@alert.id}}"
    - label: "incident_type"
      value: "Defense Evasion"
    - label: "incident_subtype"
      value: "Mass Mailbox Cleanup (M365)"
    - label: "ruleid"
      value: "{{@alert.detection_rule_id}}"
    - label: "incident_key"
      value: "mailbox"
    - label: "mailbox"
      value: "{{@alert.results_table.rows[0].mailbox}}"

tests:
  - name: "Positive - 500 SoftDelete events against one mailbox in 1h"
    now_timestamp: "2026-04-07T12:15:00.000Z"
