# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Windows - Successful Login Following Brute Force Burst"
enabled: true
description: |
  Detects a successful logon from a source IP that has just produced a burst
  of failed logons against the same Windows host or user. Triggers when, within
  a 1-hour window, the same source IP generates 10 or more failed logons
  (EventID 4625) AND at least 1 successful logon (EventID 4624). This is the
  brute-force success signature - failures stopping abruptly because the
  attacker found the right credential.

# UC#: 55
# MITRE ATT&CK: T1110 - Brute Force (TA0006 - Credential Access)
# OCSF Class: Authentication (3002)
# Log Source: Windows Security (ocsf_mapped)
# TI Source: Elastic SIEM sequence-based detection pattern
# UWS Encyclopedia: https://www.ultimatewindowssecurity.com/securitylog/encyclopedia/event.aspx?eventid=4625
#                   https://www.ultimatewindowssecurity.com/securitylog/encyclopedia/event.aspx?eventid=4624
# Existing rule reference (column M / partial overlap):
#   SR#3 'Consecutive Unsuccessful Logins to Same Account from different IPs' covers the
#   failure burst leg only (4625). UC#55 adds the success-after-failure sequence (4624
#   success from the same source that produced the 4625 burst) - catches brute-force
#   actually-successful cases that SR#3 alone cannot.

severity: Critical
query_text: |
  @index={ 81fe91d5-1dee-4321-8700-0d1c4f441770 | "ocsf_mapped" }
  ig_tenant_id = "c4134177-2fae-4a1a-8bb5-c81e997f78e5"
  metadata.labels[1] = "WINDOWS"
  (metadata.event_code = 4625 OR metadata.event_code = 4624)
  src_endpoint.ip = "*"
  | eval(is_failed = if(coalesce(metadata.event_code == 4625, false), 1, 0))
  | eval(is_success = if(coalesce(metadata.event_code == 4624, false), 1, 0))
  | stats
    sum(is_failed) as failed_count,
    sum(is_success) as success_count
    by ig_tenant_id, %ingest.import_rule_name, src_endpoint.ip
  | where(failed_count >= 10 AND success_count >= 1)
  | rename(src_endpoint.ip as source_ip)

tags:
  - techniques.t1110.t1110

time_range_s: 3600
run_frequency_s: 300
dedup_window_s: 86400
debounce: true
alert_per_row: false

alert_template:
  info:
    - label: "detectionid"
      value: "{{@alert.id}}"
      use_for_dedup: false
    - label: "incident_type"
      value: "Credential Access"
      use_for_dedup: false
    - label: "incident_subtype"
      value: "Brute Force Success (Failure Burst then Success)"
      use_for_dedup: false
    - label: "ruleid"
      value: "{{@alert.detection_rule_id}}"
      use_for_dedup: false
    - label: "incident_key"
      value: "source_ip"
      use_for_dedup: false
    - label: "source_ip"
      value: "{{@alert.results_table.rows[0].source_ip}}"
      use_for_dedup: true

tests:
  - name: "Positive - 10 failures plus 1 success from same source"
