      {"timestamp":"2026-05-13T12:01:10.000Z","metadata.labels[1]":"WINDOWS","metadata.event_code":4625,"src_endpoint.ip":"203.0.113.55","ig_tenant_id":"c4134177-2fae-4a1a-8bb5-c81e997f78e5","%ingest.import_rule_name":"authentication"}
