# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Windows - AdminSDHolder ACL Modification (SDProp Persistence)"
enabled: true
description: |
  Detects modification to the AdminSDHolder Active Directory object - the canonical
  SDProp persistence backdoor. Triggers on Windows Security EventID 5136
  (Directory Service object modified) where ObjectDN contains 'CN=AdminSDHolder'
  AND AttributeLDAPDisplayName is 'nTSecurityDescriptor' (the security descriptor
  attribute) AND OperationType is '%%14674' (Value Added - new ACE inserted).
  AdminSDHolder defines the protected ACL template that SDProp propagates onto
  every Domain Admin, Enterprise Admin, and other protected group/account on a
  regular schedule. An attacker who adds their own SID to AdminSDHolder's ACL
  gains permanent shadow-admin rights that survive routine permission cleanup -
  one of the highest-impact AD persistence techniques.

# UC#: 49
# MITRE ATT&CK: T1098 - Account Manipulation (TA0003 - Persistence)
# OCSF Class: Entity Management
# Log Source: Windows Security (ocsf_mapped)
# TI Source: Splunk Security Content - https://research.splunk.com/endpoint/00d877c3-7b7b-443d-9562-6b231e2abab9/
# UWS Encyclopedia: https://www.ultimatewindowssecurity.com/securitylog/encyclopedia/event.aspx?eventid=5136
# Field positions per Microsoft schema (UWS docs):
#   [0]=SubjectUserSid, [1]=SubjectUserName, [2]=SubjectDomainName, [3]=SubjectLogonId,
#   [4]=AppCorrelationID, [5]=DSName, [6]=DSType, [7]=ObjectDN, [8]=ObjectGUID,
#   [9]=ObjectClass, [10]=AttributeLDAPDisplayName, [11]=AttributeSyntaxOID,
#   [12]=AttributeValue, [13]=OperationType

severity: Critical
query_text: |
  @index={ 81fe91d5-1dee-4321-8700-0d1c4f441770 | "ocsf_mapped" }
  metadata.labels[1] = "WINDOWS"
  metadata.event_code = 5136
  unmapped.StringInserts.%json[7]: "CN=AdminSDHolder"
  unmapped.StringInserts.%json[10] = "nTSecurityDescriptor"
  unmapped.StringInserts.%json[13] = "%%14674"
  | stats count() as event_count
    by ig_tenant_id,
       %ingest.import_rule_name,
       actor.user.name,
       unmapped.StringInserts.%json[1],
       unmapped.StringInserts.%json[7],
       unmapped.StringInserts.%json[10],
       unmapped.StringInserts.%json[13]
  | where(event_count >= 1)
  | rename(actor.user.name as modified_by_mapped,
           unmapped.StringInserts.%json[1] as modified_by_raw,
           unmapped.StringInserts.%json[7] as object_dn,
           unmapped.StringInserts.%json[10] as attribute_modified,
           unmapped.StringInserts.%json[13] as operation_type)

tags:
  - techniques.t1098.t1098

time_range_s: 3600
run_frequency_s: 300
dedup_window_s: 86400
debounce: true
alert_per_row: false

alert_template:
  info:
    - label: "detectionid"
      value: "{{@alert.id}}"
      use_for_dedup: false
    - label: "incident_type"
      value: "Persistence"
      use_for_dedup: false
    - label: "incident_subtype"
      value: "AdminSDHolder ACL Modification (SDProp Backdoor)"
      use_for_dedup: false
    - label: "ruleid"
      value: "{{@alert.detection_rule_id}}"
      use_for_dedup: false
    - label: "incident_key"
      value: "modified_by_raw"
      use_for_dedup: false
    - label: "modified_by_raw"
      value: "{{@alert.results_table.rows[0].modified_by_raw}}"
      use_for_dedup: true

tests:
  - name: "Positive - AdminSDHolder nTSecurityDescriptor Value Added"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:01:00.000Z","metadata.labels[1]":"WINDOWS","metadata.event_code":5136,"actor.user.name":"compromised-admin","unmapped.StringInserts.%json[0]":"S-1-5-21-12345-67890-500","unmapped.StringInserts.%json[1]":"compromised-admin","unmapped.StringInserts.%json[2]":"CORP","unmapped.StringInserts.%json[7]":"CN=AdminSDHolder,CN=System,DC=corp,DC=local","unmapped.StringInserts.%json[9]":"container","unmapped.StringInserts.%json[10]":"nTSecurityDescriptor","unmapped.StringInserts.%json[13]":"%%14674","ig_tenant_id":"test-tenant","%ingest.import_rule_name":"base_event"}
    expected_detection_result: true

  - name: "Negative - 5136 modifying nTSecurityDescriptor on regular OU (not AdminSDHolder)"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:01:00.000Z","metadata.labels[1]":"WINDOWS","metadata.event_code":5136,"actor.user.name":"Administrator","unmapped.StringInserts.%json[0]":"S-1-5-21-12345-67890-500","unmapped.StringInserts.%json[1]":"Administrator","unmapped.StringInserts.%json[2]":"CORP","unmapped.StringInserts.%json[7]":"OU=Marketing,DC=corp,DC=local","unmapped.StringInserts.%json[9]":"organizationalUnit","unmapped.StringInserts.%json[10]":"nTSecurityDescriptor","unmapped.StringInserts.%json[13]":"%%14674","ig_tenant_id":"test-tenant","%ingest.import_rule_name":"base_event"}
    expected_detection_result: false

  - name: "Negative - AdminSDHolder DN but different attribute (not nTSecurityDescriptor)"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:01:00.000Z","metadata.labels[1]":"WINDOWS","metadata.event_code":5136,"actor.user.name":"Administrator","unmapped.StringInserts.%json[0]":"S-1-5-21-12345-67890-500","unmapped.StringInserts.%json[1]":"Administrator","unmapped.StringInserts.%json[2]":"CORP","unmapped.StringInserts.%json[7]":"CN=AdminSDHolder,CN=System,DC=corp,DC=local","unmapped.StringInserts.%json[9]":"container","unmapped.StringInserts.%json[10]":"description","unmapped.StringInserts.%json[13]":"%%14674","ig_tenant_id":"test-tenant","%ingest.import_rule_name":"base_event"}
    expected_detection_result: false
