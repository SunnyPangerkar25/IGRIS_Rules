# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Barracuda EGD - Quarantine Bypass (Threat Allowed Through)"
enabled: true
description: |
  Detects emails classified as a threat by Barracuda EGD (spam, phishing, scamming,
  or domain_impersonation) but still allowed through to the recipient. Excludes
  taxonomy=none (clean) and taxonomy=policy (admin-intended). Any match indicates
  a filtering gap where a detected threat reached the mailbox.

# TI Source: Build from data (no Barracuda-specific rules in Scanner/Sigma/Splunk/Elastic).
#   Intent adapted from Splunk "O365 Threat Intelligence Suspicious Email Delivered".
# Flood Check: PASS (0 events/hr both tenants, 4w window 2026-03-13 to 2026-04-10).
# References:
#   - MITRE ATT&CK T1566 - Phishing (TA0001 - Initial Access)
#   - Barracuda EGD taxonomy values: Knowledge_Base/Schema/Barracuda_EGD_schema.md
# raw_field_rule: unmapped.barracuda.%json.payload.* fields on OCSF Email Activity (4009) events.
# These fields are structured JSON, not raw string blobs. Will be swapped to proper OCSF
# columns (email.from, disposition, etc.) when ingestion completes Mapping Requirements Task 2.
severity: High
query_text: |
  @index={ 81fe91d5-1dee-4321-8700-0d1c4f441770 | "ocsf_mapped" }
    metadata.labels[1]="BARRACUDA" class_name="Email Activity"
    unmapped.barracuda.%json.payload.recipients[0].action="allowed"
    not unmapped.barracuda.%json.payload.recipients[0].taxonomy="none"
    not unmapped.barracuda.%json.payload.recipients[0].taxonomy="policy"
  | stats count() as event_count
      by ig_tenant_id, %ingest.import_rule_name, src_endpoint.ip,
         unmapped.barracuda.%json.payload.hdr_from,
         unmapped.barracuda.%json.payload.hdr_to,
         unmapped.barracuda.%json.payload.recipients[0].taxonomy,
         email.subject
  | where(event_count >= 1)
  | rename(unmapped.barracuda.%json.payload.hdr_from as sender,
           unmapped.barracuda.%json.payload.hdr_to as recipient,
           unmapped.barracuda.%json.payload.recipients[0].taxonomy as threat_taxonomy,
           src_endpoint.ip as source_ip)

tags:
  - techniques.t1566.phishing

time_range_s: 3600
run_frequency_s: 300

alert_template:
  info:
    - label: "detectionid"
      value: "{{@alert.id}}"
    - label: "incident_type"
      value: "Email Threat"
    - label: "incident_subtype"
      value: "Quarantine Bypass - Threat Allowed"
    - label: "ruleid"
      value: "{{@alert.detection_rule_id}}"
    - label: "incident_key"
      value: "sender"
    - label: "key_entity"
      value: "{{sender}}"

tests:
  - name: "Positive - phishing email allowed through"
    now_timestamp: "2026-04-08T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-04-08T12:01:00.000Z","metadata.labels[1]":"BARRACUDA","class_name":"Email Activity","unmapped.barracuda.%json.payload.recipients[0].action":"allowed","unmapped.barracuda.%json.payload.recipients[0].taxonomy":"phishing","unmapped.barracuda.%json.payload.hdr_from":"attacker@evil.com","unmapped.barracuda.%json.payload.hdr_to":"victim@corp.com","src_endpoint.ip":"185.220.101.5","email.subject":"Urgent: Verify your account","ig_tenant_id":"test-tenant","%ingest.import_rule_name":"email_activity"}
    expected_detection_result: true

  - name: "Negative - allowed but taxonomy is none (clean email)"
    now_timestamp: "2026-04-08T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-04-08T12:01:00.000Z","metadata.labels[1]":"BARRACUDA","class_name":"Email Activity","unmapped.barracuda.%json.payload.recipients[0].action":"allowed","unmapped.barracuda.%json.payload.recipients[0].taxonomy":"none","unmapped.barracuda.%json.payload.hdr_from":"legit@partner.com","unmapped.barracuda.%json.payload.hdr_to":"user@corp.com","src_endpoint.ip":"52.101.225.80","email.subject":"Meeting notes","ig_tenant_id":"test-tenant","%ingest.import_rule_name":"email_activity"}
    expected_detection_result: false

  - name: "Negative - blocked email with threat taxonomy (not a bypass)"
    now_timestamp: "2026-04-08T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-04-08T12:01:00.000Z","metadata.labels[1]":"BARRACUDA","class_name":"Email Activity","unmapped.barracuda.%json.payload.recipients[0].action":"blocked","unmapped.barracuda.%json.payload.recipients[0].taxonomy":"phishing","unmapped.barracuda.%json.payload.hdr_from":"attacker@evil.com","unmapped.barracuda.%json.payload.hdr_to":"victim@corp.com","src_endpoint.ip":"185.220.101.5","email.subject":"Reset password now","ig_tenant_id":"test-tenant","%ingest.import_rule_name":"email_activity"}
    expected_detection_result: false
