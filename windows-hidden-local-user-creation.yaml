# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Windows - Hidden Local User Creation (Trailing Dollar Sign)"
enabled: true
description: |
  Detects creation of a Windows user account whose TargetUserName ends with a
  trailing dollar sign ($). Triggers on Windows Security EventID 4720 (a user
  account was created) where TargetUserName ends with $. The trailing $ causes
  the account to be omitted from the standard Windows logon screen and most
  management UIs - a defense-evasion technique used to hide a persistence
  backdoor account. Note: legitimate computer accounts also end with $ but are
  created via EventID 4741 (not 4720); seeing $-suffixed names under 4720 is
  anomalous.

# UC#: 50
# MITRE ATT&CK: T1564.002 - Hide Artifacts: Hidden Users (TA0005 - Defense Evasion)
# OCSF Class: Account Change
# Log Source: Windows Security (ocsf_mapped)
# TI Source: SigmaHQ - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_hidden_user_creation.yml
# Field positions verified live:
#   [0]=TargetUserName, [1]=TargetDomainName, [2]=TargetSid,
#   [3]=SubjectUserSid, [4]=SubjectUserName

severity: High
query_text: |
  @index={ 81fe91d5-1dee-4321-8700-0d1c4f441770 | "ocsf_mapped" }
  metadata.labels[1] = "WINDOWS"
  metadata.event_code = 4720
  unmapped.StringInserts.%json[0] = "*$"
  | stats count() as event_count
    by ig_tenant_id,
       %ingest.import_rule_name,
       actor.user.name,
       unmapped.StringInserts.%json[0],
       unmapped.StringInserts.%json[2]
  | where(event_count >= 1)
  | rename(actor.user.name as created_by,
           unmapped.StringInserts.%json[0] as target_user,
           unmapped.StringInserts.%json[2] as target_sid)

tags:
  - techniques.t1564.002.t1564_002

time_range_s: 3600
run_frequency_s: 300
dedup_window_s: 86400
debounce: true
alert_per_row: false

alert_template:
  info:
    - label: "detectionid"
      value: "{{@alert.id}}"
      use_for_dedup: false
    - label: "incident_type"
      value: "Persistence"
      use_for_dedup: false
    - label: "incident_subtype"
      value: "Hidden Local User Creation"
      use_for_dedup: false
    - label: "ruleid"
      value: "{{@alert.detection_rule_id}}"
      use_for_dedup: false
    - label: "incident_key"
      value: "target_user"
      use_for_dedup: false
    - label: "target_user"
      value: "{{@alert.results_table.rows[0].target_user}}"
      use_for_dedup: true

tests:
  - name: "Positive - 4720 with TargetUserName ending in $ (hidden user)"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:01:00.000Z","metadata.labels[1]":"WINDOWS","metadata.event_code":4720,"actor.user.name":"Administrator","unmapped.StringInserts.%json[0]":"backdoor$","unmapped.StringInserts.%json[1]":"CORP","unmapped.StringInserts.%json[2]":"S-1-5-21-12345-67890-1234","unmapped.StringInserts.%json[3]":"S-1-5-21-12345-67890-500","unmapped.StringInserts.%json[4]":"Administrator","ig_tenant_id":"test-tenant","%ingest.import_rule_name":"base_event"}
    expected_detection_result: true

  - name: "Negative - 4720 with normal TargetUserName (no trailing $)"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:01:00.000Z","metadata.labels[1]":"WINDOWS","metadata.event_code":4720,"actor.user.name":"Administrator","unmapped.StringInserts.%json[0]":"jdoe","unmapped.StringInserts.%json[1]":"CORP","unmapped.StringInserts.%json[2]":"S-1-5-21-12345-67890-1234","unmapped.StringInserts.%json[3]":"S-1-5-21-12345-67890-500","unmapped.StringInserts.%json[4]":"Administrator","ig_tenant_id":"test-tenant","%ingest.import_rule_name":"base_event"}
    expected_detection_result: false
