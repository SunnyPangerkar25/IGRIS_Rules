# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Barracuda EGD - Multi-Sender Email Spray (Compromised Infrastructure)"
enabled: true
description: |
  Detects 10 or more distinct envelope senders from the same source IP within
  6 hours. This behavioral pattern indicates compromised mail infrastructure,
  bulk-registered domain abuse, or SaaS tenant compromise — multiple mailboxes
  on the same server spraying a target organization. No taxonomy filter applied:
  catches zero-day campaigns where Barracuda has not yet classified the threat.

# MITRE ATT&CK: T1586.002 - Compromise Accounts: Email Accounts (TA0042 - Resource Development)
# OCSF Class: Email Activity (4009)
# Log Source: Barracuda EGD (ocsf_mapped)
# TI Source: Build from data. Tradecraft: compromised infrastructure spray / domain-based
#   phishing campaign. No existing rules in Scanner/Sigma/Splunk/Elastic for this pattern.
# Flood Check: PASS — max 6 unique senders per IP over 4w (both tenants). 0.04 events/hr max.
#   Threshold of 10 is conservative for current volume. Consider lowering to 5 if data grows.
# References:
#   - MITRE ATT&CK T1586.002 - Compromise Accounts: Email Accounts
#   - Barracuda EGD schema: Knowledge_Base/Schema/Barracuda_EGD_schema.md
severity: High
query_text: |
  @index={ 81fe91d5-1dee-4321-8700-0d1c4f441770 | "ocsf_mapped" }
    metadata.labels[1]="BARRACUDA" class_name="Email Activity"
  | stats count() as event_count,
      countdistinct(unmapped.barracuda.%json.payload.env_from) as unique_senders
      by ig_tenant_id, %ingest.import_rule_name, src_endpoint.ip
  | where(unique_senders >= 10)
  | rename(src_endpoint.ip as source_ip)

tags:
  - techniques.t1586_002.compromise_accounts_email

time_range_s: 21600
run_frequency_s: 900

alert_template:
  info:
    - label: "detectionid"
      value: "{{@alert.id}}"
    - label: "incident_type"
      value: "Email Threat"
    - label: "incident_subtype"
      value: "Multi-Sender Email Spray (Compromised Infrastructure)"
    - label: "ruleid"
      value: "{{@alert.detection_rule_id}}"
    - label: "incident_key"
      value: "source_ip"
    - label: "key_entity"
      value: "{{source_ip}}"

