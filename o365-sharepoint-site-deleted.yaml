# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Microsoft 365 - SharePoint Site Deleted"
enabled: true
description: |
  Detects when a SharePoint site is deleted (SiteDeleted operation). Site
  deletion is a high-impact administrative event that can be used to destroy
  collaboration data, hide evidence, or as part of a tenant takeover. Site
  deletions are rare in legitimate operations and warrant immediate triage.

  References:
  * https://attack.mitre.org/techniques/T1485/
  * https://learn.microsoft.com/en-us/sharepoint/audit-log-events

# MITRE ATT&CK: T1485 - Data Destruction (TA0040 - Impact)
# OCSF Class: Entity Management (3004)
# Log Source: O365 SharePoint (ocsf_mapped)
# Note: Verified 2026-04-08 - SiteDeleted lands in Entity Management 3004
# across 4 tenants (fe63b 51, a45d4 8, 34cff 4, b38d2 1).
severity: Critical

query_text: |
  @index={ 81fe91d5-1dee-4321-8700-0d1c4f441770 | "ocsf_mapped" }
  metadata.labels[1] = "O365"
  class_uid = 3004
  unmapped.Operation = "SiteDeleted"
  | stats count() as delete_count
    by ig_tenant_id, %ingest.import_rule_name, actor.user.email_addr, unmapped.ObjectId
  | where(delete_count >= 1)
  | rename(actor.user.email_addr as actor_user, unmapped.ObjectId as site_url)

tags:
  - techniques.t1485.data_destruction

time_range_s: 900
run_frequency_s: 300

alert_template:
  info:
    - label: "detectionid"
      value: "{{@alert.id}}"
    - label: "incident_type"
      value: "Data Destruction"
    - label: "incident_subtype"
      value: "SharePoint Site Deleted (M365)"
    - label: "ruleid"
      value: "{{@alert.detection_rule_id}}"
    - label: "incident_key"
      value: "site_url"
    - label: "site_url"
      value: "{{@alert.results_table.rows[0].site_url}}"

tests:
  - name: "Positive - SiteDeleted by an actor"
    now_timestamp: "2026-04-07T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-04-07T12:10:00.000Z","metadata":{"labels":["CLOUD","O365"]},"ig_tenant_id":"test-tenant","%ingest.import_rule_name":"base_event","class_uid":3004,"actor":{"user":{"email_addr":"admin@example.com"}},"unmapped":{"Operation":"SiteDeleted","ObjectId":"https://contoso.sharepoint.com/sites/finance"}}
    expected_detection_result: true

  - name: "Negative - unrelated SharePoint operation"
    now_timestamp: "2026-04-07T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-04-07T12:10:00.000Z","metadata":{"labels":["CLOUD","O365"]},"ig_tenant_id":"test-tenant","%ingest.import_rule_name":"base_event","class_uid":3004,"actor":{"user":{"email_addr":"admin@example.com"}},"unmapped":{"Operation":"SiteCollectionCreated","ObjectId":"https://contoso.sharepoint.com/sites/marketing"}}
    expected_detection_result: false
