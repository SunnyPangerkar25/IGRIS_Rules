# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Raychem_CrowdStrike - Cross-Host Detection Spread"
enabled: true
description: |
  Fires when the same CrowdStrike Falcon detection title appears on 3 or more
  distinct hosts within a 6-hour window. Catches horizontal campaign-style
  activity such as worm spread, mass exploitation, or cross-environment
  pivoting. Confirmed false-positive patterns are suppressed at the rule level
  so legitimate operational activity affecting multiple hosts does not trigger.

# Tenant: Raychem (c4134177-2fae-4a1a-8bb5-c81e997f78e5)
# MITRE ATT&CK: Multiple - signal is the spread, not the technique
# OCSF Class: Detection Finding (2004)
# Log Source: CrowdStrike Falcon XDR - Alerts API (ocsf_mapped)
# TI Source: Build from data - cross-host correlation pattern
# Flood Check: After FP suppression, 0 fires in 2-week baseline. Lies in wait
#              for actual campaign / worm patterns.
# Note: device.name is NOT in stats-by clause because we countdistinct() on it.
#       Grouping uses common dimensions (title, severity, tactic) so spread
#       across hosts is unified into one alert.
# FP Exceptions:
#   1. Veeam VSS operations on backup servers (RRLHLBKSRV / RRLVEEMBKPSRV /
#      RRLVSBCKSRV where Veeam.Backup.ManagerGCServer.exe is the offender).
#   2. IT admin svchost-spawned activity on the SIEM server (RRPLSIEMSRV
#      where parent process is svchost.exe).
severity: High
query_text: |
  @index={ 81fe91d5-1dee-4321-8700-0d1c4f441770 | "ocsf_mapped" }
  ig_tenant_id = "c4134177-2fae-4a1a-8bb5-c81e997f78e5"
  metadata.labels[1] = CROWDSTRIKE
  and not unmapped.product = "automated-lead"
  and not unmapped.severity_name = "Low"
  and not (
      device.name : (RRLHLBKSRV RRLVEEMBKPSRV RRLVSBCKSRV)
      and finding_info.title : VolumeShadowSnapshot*
      and unmapped.filename = "Veeam.Backup.ManagerGCServer.exe"
  )
  and not (
      device.name = "RRPLSIEMSRV"
      and finding_info.title : "FileSystemTamperFalconSensor*"
      and unmapped.parent_details.%json.filename = "svchost.exe"
  )
  | stats
      countdistinct(device.name) as host_count,
      count() as total_events
    by ig_tenant_id,
       %ingest.import_rule_name,
       finding_info.title,
       unmapped.severity_name,
       unmapped.tactic,
       unmapped.technique,
       unmapped.scenario
  | where(host_count >= 3)
  | rename(
      finding_info.title as finding_name,
      unmapped.severity_name as falcon_severity,
      unmapped.tactic as mitre_tactic,
      unmapped.technique as mitre_technique,
      unmapped.scenario as scenario
    )

tags:
  - techniques.universal.crowdstrike_cross_host_spread

time_range_s: 21600
run_frequency_s: 21600

alert_template:
  info:
    - label: "detectionid"
      value: "{{@alert.id}}"
    - label: "incident_type"
      value: "EDR Alert"
    - label: "incident_subtype"
      value: "CrowdStrike Cross-Host Detection Spread"
    - label: "ruleid"
      value: "{{@alert.detection_rule_id}}"
    - label: "incident_key"
      value: "finding_name"
    - label: "finding_name"
      value: "{{@alert.results_table.rows[0].finding_name}}"

tests:
  - name: "Positive - Same finding on 3 distinct hosts should fire"
    now_timestamp: "2026-05-11T12:00:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-11T11:00:00.000Z","ig_tenant_id":"c4134177-2fae-4a1a-8bb5-c81e997f78e5","%ingest.import_rule_name":"detection_finding","metadata.labels[1]":"CROWDSTRIKE","finding_info.title":"SuspiciousMassExploit","device.name":"HOST-A","unmapped.severity_name":"High","unmapped.tactic":"Initial Access","unmapped.technique":"Exploit Public-Facing Application","unmapped.scenario":"attacker_methodology","unmapped.product":"epp","unmapped.filename":"w3wp.exe","unmapped.parent_details.%json.filename":"svchost.exe"}
      {"timestamp":"2026-05-11T11:15:00.000Z","ig_tenant_id":"c4134177-2fae-4a1a-8bb5-c81e997f78e5","%ingest.import_rule_name":"detection_finding","metadata.labels[1]":"CROWDSTRIKE","finding_info.title":"SuspiciousMassExploit","device.name":"HOST-B","unmapped.severity_name":"High","unmapped.tactic":"Initial Access","unmapped.technique":"Exploit Public-Facing Application","unmapped.scenario":"attacker_methodology","unmapped.product":"epp","unmapped.filename":"w3wp.exe","unmapped.parent_details.%json.filename":"svchost.exe"}
      {"timestamp":"2026-05-11T11:30:00.000Z","ig_tenant_id":"c4134177-2fae-4a1a-8bb5-c81e997f78e5","%ingest.import_rule_name":"detection_finding","metadata.labels[1]":"CROWDSTRIKE","finding_info.title":"SuspiciousMassExploit","device.name":"HOST-C","unmapped.severity_name":"High","unmapped.tactic":"Initial Access","unmapped.technique":"Exploit Public-Facing Application","unmapped.scenario":"attacker_methodology","unmapped.product":"epp","unmapped.filename":"w3wp.exe","unmapped.parent_details.%json.filename":"svchost.exe"}
    expected_detection_result: true

  - name: "Negative - Same finding on only 2 distinct hosts should not fire"
    now_timestamp: "2026-05-11T12:00:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-11T11:00:00.000Z","ig_tenant_id":"c4134177-2fae-4a1a-8bb5-c81e997f78e5","%ingest.import_rule_name":"detection_finding","metadata.labels[1]":"CROWDSTRIKE","finding_info.title":"HiveCredTheft","device.name":"HOST-A","unmapped.severity_name":"Critical","unmapped.tactic":"Credential Access","unmapped.technique":"OS Credential Dumping","unmapped.scenario":"credential_theft","unmapped.product":"epp","unmapped.filename":"reg.exe","unmapped.parent_details.%json.filename":"cmd.exe"}
      {"timestamp":"2026-05-11T11:30:00.000Z","ig_tenant_id":"c4134177-2fae-4a1a-8bb5-c81e997f78e5","%ingest.import_rule_name":"detection_finding","metadata.labels[1]":"CROWDSTRIKE","finding_info.title":"HiveCredTheft","device.name":"HOST-B","unmapped.severity_name":"Critical","unmapped.tactic":"Credential Access","unmapped.technique":"OS Credential Dumping","unmapped.scenario":"credential_theft","unmapped.product":"epp","unmapped.filename":"reg.exe","unmapped.parent_details.%json.filename":"cmd.exe"}
    expected_detection_result: false

  - name: "Negative - Veeam VSS on 3 backup servers suppressed before count"
    now_timestamp: "2026-05-11T12:00:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-11T11:00:00.000Z","ig_tenant_id":"c4134177-2fae-4a1a-8bb5-c81e997f78e5","%ingest.import_rule_name":"detection_finding","metadata.labels[1]":"CROWDSTRIKE","finding_info.title":"VolumeShadowSnapshotDeleted","device.name":"RRLHLBKSRV","unmapped.severity_name":"Medium","unmapped.tactic":"Impact","unmapped.technique":"Inhibit System Recovery","unmapped.scenario":"ransomware","unmapped.product":"epp","unmapped.filename":"Veeam.Backup.ManagerGCServer.exe","unmapped.parent_details.%json.filename":"Veeam.Backup.Service.exe"}
      {"timestamp":"2026-05-11T11:15:00.000Z","ig_tenant_id":"c4134177-2fae-4a1a-8bb5-c81e997f78e5","%ingest.import_rule_name":"detection_finding","metadata.labels[1]":"CROWDSTRIKE","finding_info.title":"VolumeShadowSnapshotDeleted","device.name":"RRLVEEMBKPSRV","unmapped.severity_name":"Medium","unmapped.tactic":"Impact","unmapped.technique":"Inhibit System Recovery","unmapped.scenario":"ransomware","unmapped.product":"epp","unmapped.filename":"Veeam.Backup.ManagerGCServer.exe","unmapped.parent_details.%json.filename":"Veeam.Backup.Service.exe"}
      {"timestamp":"2026-05-11T11:30:00.000Z","ig_tenant_id":"c4134177-2fae-4a1a-8bb5-c81e997f78e5","%ingest.import_rule_name":"detection_finding","metadata.labels[1]":"CROWDSTRIKE","finding_info.title":"VolumeShadowSnapshotDeleted","device.name":"RRLVSBCKSRV","unmapped.severity_name":"Medium","unmapped.tactic":"Impact","unmapped.technique":"Inhibit System Recovery","unmapped.scenario":"ransomware","unmapped.product":"epp","unmapped.filename":"Veeam.Backup.ManagerGCServer.exe","unmapped.parent_details.%json.filename":"Veeam.Backup.Service.exe"}
    expected_detection_result: false
