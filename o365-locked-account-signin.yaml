# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Microsoft 365 - Sign-in Attempt on Locked or Disabled Account"
enabled: true
description: |
  Detects O365 authentication failures where Azure AD reports the account as
  locked (IdsLocked), the device as disabled (DeviceIsDisabled), or the user
  as unauthorized (UserUnauthorized). These conditions indicate either a
  successful automated attack that triggered backend lockout, or an attempt
  against a deprovisioned account — both are post-initial-access indicators
  worth immediate triage.

  Excludes benign failures (MFA required, bad password, device cert issues)
  which are already covered by the brute-force rule or are operational noise.

  References:
  * https://attack.mitre.org/techniques/T1078/
  * https://learn.microsoft.com/en-us/azure/active-directory/reports-monitoring/reference-sign-ins-error-codes

# MITRE ATT&CK: T1078 - Valid Accounts (TA0001 - Initial Access)
# OCSF Class: Authentication (3002)
# Log Source: O365 (ocsf_mapped)
# Note: Field discovery 2026-04-08 — Scanner stores Microsoft text error names
# (IdsLocked, UserUnauthorized) in unmapped.LogonError, NOT numeric AADSTS codes.
# status_detail collapses to "Failed" for all failures — granular signal is in
# unmapped.LogonError only. Fleet 4w distribution: IdsLocked 7,162,
# DeviceIsDisabled 85, UserUnauthorized 9.
severity: High

query_text: |
  @index={ 81fe91d5-1dee-4321-8700-0d1c4f441770 | "ocsf_mapped" }
  metadata.labels[1] = "O365"
  class_uid = 3002
  status_id = 2
  unmapped.LogonError: ("IdsLocked" "DeviceIsDisabled" "UserUnauthorized")
  | stats count() as fail_count
    by ig_tenant_id, %ingest.import_rule_name, user.email_addr, src_endpoint.ip, unmapped.LogonError
  | where(fail_count >= 1)
  | rename(user.email_addr as username, src_endpoint.ip as source_ip, unmapped.LogonError as logon_error)

tags:
  - techniques.t1078.valid_accounts

time_range_s: 900
run_frequency_s: 300

alert_template:
  info:
    - label: "detectionid"
      value: "{{@alert.id}}"
    - label: "incident_type"
      value: "Identity & Access Security"
    - label: "incident_subtype"
      value: "Locked or Disabled Account Sign-in Attempt (M365)"
    - label: "ruleid"
      value: "{{@alert.detection_rule_id}}"
    - label: "incident_key"
      value: "username"
    - label: "username"
      value: "{{@alert.results_table.rows[0].username}}"

tests:
  - name: "Positive - IdsLocked against a user"
    now_timestamp: "2026-04-07T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-04-07T12:10:00.000Z","metadata":{"labels":["CLOUD","O365"]},"ig_tenant_id":"test-tenant","%ingest.import_rule_name":"authentication","class_uid":3002,"status_id":2,"user":{"email_addr":"rahul@example.com"},"src_endpoint":{"ip":"173.239.218.152"},"unmapped":{"LogonError":"IdsLocked"}}
    expected_detection_result: true

  - name: "Negative - benign MFA challenge (UserStrongAuthClientAuthNRequired)"
    now_timestamp: "2026-04-07T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-04-07T12:10:00.000Z","metadata":{"labels":["CLOUD","O365"]},"ig_tenant_id":"test-tenant","%ingest.import_rule_name":"authentication","class_uid":3002,"status_id":2,"user":{"email_addr":"alice@example.com"},"src_endpoint":{"ip":"10.0.0.5"},"unmapped":{"LogonError":"UserStrongAuthClientAuthNRequired"}}
    expected_detection_result: false
