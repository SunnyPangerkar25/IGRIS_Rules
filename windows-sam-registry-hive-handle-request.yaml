# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Windows - SAM Registry Hive Handle Request"
enabled: true
description: |
  Detects a handle request to the SAM registry hive - typical of offline
  credential dumping (reg save HKLM\SAM, samdump2, secretsdump, etc.).
  Triggers on Windows Security EventID 4656 where ObjectType=Key AND
  ObjectName path ends with \SAM. Windows restricts SAM-hive direct access
  while the system is running; positive hits indicate credential-harvesting
  tools attempting to extract local password hashes from the SAM database.

# UC#: 10
# poc_build: true
# primary_platform: CrowdStrike Falcon EDR
# reason: EDR provides registry-access events with calling-process attribution and full
#   command-line context. 4656 requires Object Access audit to be enabled per-key and lacks
#   process attribution detail. Built here because logging is available - re-evaluate post-POC.
# raw_field_rule: true
# raw_field_reason: 4656 is Category B (Windows partial OCSF mapping; object-access events
#   not OCSF-mapped - they land via raw_data path under ocsf_mapped).
# MITRE ATT&CK: T1003.002 - OS Credential Dumping: Security Account Manager (TA0006 - Credential Access)
# Log Source: Windows Security (ocsf_mapped via raw_data path - Category B raw-field rule)
# TI Source: SigmaHQ - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_sam_registry_hive_handle_request.yml
# UWS Encyclopedia: https://www.ultimatewindowssecurity.com/securitylog/encyclopedia/event.aspx?eventid=4656
# Field positions verified live (4656 Key ObjectType):
#   [1]=SubjectUserName, [5]=ObjectType, [6]=ObjectName, [11]=AccessMask,
#   [15]=ProcessName (caller)

severity: Critical
query_text: |
  @index={ 81fe91d5-1dee-4321-8700-0d1c4f441770 | "ocsf_mapped" }
  metadata.labels[1] = "WINDOWS"
  raw_data.%json.EventID = 4656
  raw_data.%json.StringInserts[5] = "Key"
  raw_data.%json.StringInserts[6] = "*\\SAM"
  | stats count() as event_count
    by ig_tenant_id,
       %ingest.import_rule_name,
       raw_data.%json.hostname,
       raw_data.%json.StringInserts[1],
       raw_data.%json.StringInserts[6],
       raw_data.%json.StringInserts[11],
       raw_data.%json.StringInserts[15]
  | where(event_count >= 1)
  | rename(raw_data.%json.hostname as hostname,
           raw_data.%json.StringInserts[1] as subject_user,
           raw_data.%json.StringInserts[6] as object_name,
           raw_data.%json.StringInserts[11] as access_mask,
           raw_data.%json.StringInserts[15] as caller_process)

tags:
  - techniques.t1003.002.t1003_002

time_range_s: 3600
run_frequency_s: 300
dedup_window_s: 86400
debounce: true
alert_per_row: false

alert_template:
  info:
    - label: "detectionid"
      value: "{{@alert.id}}"
      use_for_dedup: false
    - label: "incident_type"
      value: "Credential Access"
      use_for_dedup: false
    - label: "incident_subtype"
      value: "SAM Registry Hive Handle Request"
      use_for_dedup: false
    - label: "ruleid"
      value: "{{@alert.detection_rule_id}}"
      use_for_dedup: false
    - label: "incident_key"
      value: "hostname"
      use_for_dedup: false
    - label: "hostname"
      value: "{{@alert.results_table.rows[0].hostname}}"
      use_for_dedup: true

tests:
  - name: "Positive - SAM hive handle requested by reg.exe"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:01:00.000Z","metadata.labels[1]":"WINDOWS","raw_data.%json.EventID":4656,"raw_data.%json.hostname":"HOST01","raw_data.%json.StringInserts[1]":"admin","raw_data.%json.StringInserts[5]":"Key","raw_data.%json.StringInserts[6]":"\\REGISTRY\\MACHINE\\SAM\\SAM","raw_data.%json.StringInserts[11]":"0x20019","raw_data.%json.StringInserts[15]":"C:\\Windows\\System32\\reg.exe","ig_tenant_id":"c4134177-2fae-4a1a-8bb5-c81e997f78e5","%ingest.import_rule_name":"base_event"}
    expected_detection_result: true

  - name: "Negative - Key handle for EventLog autologger (does not end with \\SAM)"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:01:00.000Z","metadata.labels[1]":"WINDOWS","raw_data.%json.EventID":4656,"raw_data.%json.hostname":"HOST02","raw_data.%json.StringInserts[1]":"system","raw_data.%json.StringInserts[5]":"Key","raw_data.%json.StringInserts[6]":"\\REGISTRY\\MACHINE\\SYSTEM\\ControlSet001\\Control\\WMI\\Autologger\\EventLog-Security","raw_data.%json.StringInserts[11]":"0x20019","raw_data.%json.StringInserts[15]":"C:\\Windows\\System32\\svchost.exe","ig_tenant_id":"c4134177-2fae-4a1a-8bb5-c81e997f78e5","%ingest.import_rule_name":"base_event"}
    expected_detection_result: false

  - name: "Negative - Different ObjectType (Process, not Key)"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:01:00.000Z","metadata.labels[1]":"WINDOWS","raw_data.%json.EventID":4656,"raw_data.%json.hostname":"HOST03","raw_data.%json.StringInserts[1]":"admin","raw_data.%json.StringInserts[5]":"Process","raw_data.%json.StringInserts[6]":"\\Device\\HarddiskVolume3\\Windows\\System32\\lsass.exe","raw_data.%json.StringInserts[11]":"0x410","raw_data.%json.StringInserts[15]":"C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe","ig_tenant_id":"c4134177-2fae-4a1a-8bb5-c81e997f78e5","%ingest.import_rule_name":"base_event"}
    expected_detection_result: false
