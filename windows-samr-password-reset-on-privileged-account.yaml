# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Windows - SAMR Password Reset on Privileged Account"
enabled: true
description: |
  Detects password resets performed against privileged Windows accounts via the
  SAMR API (SamiChangePasswordUser / SamSetInformationUser). Triggers on
  Windows Security EventID 4724 (an attempt was made to reset an account's
  password) where the TargetUserName matches privileged-naming patterns
  (contains 'Admin', 'super', 'SVC', 'DC0', 'service', 'ADM') OR the TargetSid
  ends with '-500' (the well-known built-in Administrator RID). Single-event
  detection - any password reset of a privileged account is high-impact and
  warrants immediate review.

# UC#: 9
# MITRE ATT&CK: T1098.001 - Account Manipulation: Additional Cloud Credentials (TA0003 - Persistence)
# OCSF Class: Account Change
# Log Source: Windows Security (ocsf_mapped)
# TI Source: Elastic - https://www.elastic.co/guide/en/security/current/account-password-reset-remotely.html
# UWS Encyclopedia: https://www.ultimatewindowssecurity.com/securitylog/encyclopedia/event.aspx?eventid=4724
# Existing rule reference (column M / partial overlap):
#   SR#30 'Windows Multiple Account Passwords Changed' covers 4724 with volumetric
#   threshold (>=5 unique users in 10min). UC#9 adds privileged-target filtering
#   for single-event detection of high-impact resets that may not exceed SR#30's
#   threshold.
# Field positions verified: [0]=TargetUserName, [2]=TargetSid,
# [4]=SubjectUserName (the actor performing the reset).

severity: High
query_text: |
  @index={ 81fe91d5-1dee-4321-8700-0d1c4f441770 | "ocsf_mapped" }
  ig_tenant_id = "c4134177-2fae-4a1a-8bb5-c81e997f78e5"
  metadata.labels[1] = "WINDOWS"
  metadata.event_code = 4724
  (unmapped.StringInserts.%json[0] = "*Admin*" OR
   unmapped.StringInserts.%json[0] = "*super*" OR
   unmapped.StringInserts.%json[0] = "*SVC*" OR
   unmapped.StringInserts.%json[0] = "*DC0*" OR
   unmapped.StringInserts.%json[0] = "*service*" OR
   unmapped.StringInserts.%json[0] = "*ADM*" OR
   unmapped.StringInserts.%json[2] = "*-500")
  | stats count() as event_count
    by ig_tenant_id,
       %ingest.import_rule_name,
       actor.user.name,
       unmapped.StringInserts.%json[0],
       unmapped.StringInserts.%json[2],
       unmapped.StringInserts.%json[4]
  | where(event_count >= 1)
  | rename(actor.user.name as reset_by_mapped,
           unmapped.StringInserts.%json[0] as target_user,
           unmapped.StringInserts.%json[2] as target_sid,
           unmapped.StringInserts.%json[4] as reset_by_raw)

tags:
  - techniques.t1098.001.t1098_001

time_range_s: 3600
run_frequency_s: 300
dedup_window_s: 86400
debounce: true
alert_per_row: false

alert_template:
  info:
    - label: "detectionid"
      value: "{{@alert.id}}"
      use_for_dedup: false
    - label: "incident_type"
      value: "Persistence"
      use_for_dedup: false
    - label: "incident_subtype"
      value: "Privileged Account Password Reset (SAMR)"
      use_for_dedup: false
    - label: "ruleid"
      value: "{{@alert.detection_rule_id}}"
      use_for_dedup: false
    - label: "incident_key"
      value: "target_user"
      use_for_dedup: false
    - label: "target_user"
      value: "{{@alert.results_table.rows[0].target_user}}"
      use_for_dedup: true

tests:
  - name: "Positive - 4724 reset against Administrator (TargetUserName contains 'Admin')"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:01:00.000Z","metadata.labels[1]":"WINDOWS","metadata.event_code":4724,"actor.user.name":"compromised","unmapped.StringInserts.%json[0]":"DomainAdmin","unmapped.StringInserts.%json[1]":"CORP","unmapped.StringInserts.%json[2]":"S-1-5-21-12345-67890-1001","unmapped.StringInserts.%json[3]":"S-1-5-21-12345-67890-500","unmapped.StringInserts.%json[4]":"compromised","ig_tenant_id":"c4134177-2fae-4a1a-8bb5-c81e997f78e5","%ingest.import_rule_name":"base_event"}
    expected_detection_result: true

  - name: "Positive - 4724 reset where TargetSid ends with -500 (built-in admin)"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:02:00.000Z","metadata.labels[1]":"WINDOWS","metadata.event_code":4724,"actor.user.name":"attacker","unmapped.StringInserts.%json[0]":"renamed_admin","unmapped.StringInserts.%json[1]":"CORP","unmapped.StringInserts.%json[2]":"S-1-5-21-99999-88888-500","unmapped.StringInserts.%json[3]":"S-1-5-21-99999-88888-500","unmapped.StringInserts.%json[4]":"attacker","ig_tenant_id":"c4134177-2fae-4a1a-8bb5-c81e997f78e5","%ingest.import_rule_name":"base_event"}
    expected_detection_result: true

  - name: "Negative - 4724 reset against regular user (no privileged pattern)"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:01:00.000Z","metadata.labels[1]":"WINDOWS","metadata.event_code":4724,"actor.user.name":"helpdesk","unmapped.StringInserts.%json[0]":"jdoe","unmapped.StringInserts.%json[1]":"CORP","unmapped.StringInserts.%json[2]":"S-1-5-21-12345-67890-1234","unmapped.StringInserts.%json[3]":"S-1-5-21-12345-67890-1100","unmapped.StringInserts.%json[4]":"helpdesk","ig_tenant_id":"c4134177-2fae-4a1a-8bb5-c81e997f78e5","%ingest.import_rule_name":"base_event"}
    expected_detection_result: false
