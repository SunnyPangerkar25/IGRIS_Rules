# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Raychem_CrowdStrike - Falcon Detections"
enabled: true
description: |
  Mirrors CrowdStrike Falcon detection findings with burst compression.
  Events sharing the same signature within an hour collapse into a single
  alert with event_count and affected_hosts counts. Diverse real activity
  continues to produce distinct alerts. Confirmed false-positive patterns
  and Low severity findings are suppressed at the rule level.

# Tenant: Raychem (c4134177-2fae-4a1a-8bb5-c81e997f78e5)
# MITRE ATT&CK: Multiple - inherits from CrowdStrike finding mapping per event
# OCSF Class: Detection Finding (2004)
# Log Source: CrowdStrike Falcon XDR - Alerts API (ocsf_mapped)
# TI Source: Build from data - CrowdStrike Falcon native detection findings
# Flood Check: 2-week baseline 62 distinct rows pre-compression, 29 post-compression
#              (~53% reduction). Expected ~3.6 alerts/day after suppressions.
# Note: hour_bucket = nanoseconds / 3.6e12, identifies same-hour groups.
#       finding_info.uid is intentionally NOT in stats-by so identical scripted
#       activity within the same hour collapses into one row.
# FP Exceptions:
#   1. Veeam VSS operations on backup servers (RRLHLBKSRV / RRLVEEMBKPSRV /
#      RRLVSBCKSRV where Veeam.Backup.ManagerGCServer.exe is the offender).
#   2. IT admin svchost-spawned activity on the SIEM server (RRPLSIEMSRV
#      where parent process is svchost.exe).
# Compression signature: finding_info.title + unmapped.user_name +
#   unmapped.filename + unmapped.cmdline + parent_filename + parent_cmdline +
#   pattern_disposition + hour_bucket. Different on any one field -> separate row.
severity: High
query_text: |
  @index={ 81fe91d5-1dee-4321-8700-0d1c4f441770 | "ocsf_mapped" }
  ig_tenant_id = "c4134177-2fae-4a1a-8bb5-c81e997f78e5"
  metadata.labels[1] = CROWDSTRIKE
  and not unmapped.product = "automated-lead"
  and not unmapped.severity_name = "Low"
  and not (
      device.name : (RRLHLBKSRV RRLVEEMBKPSRV RRLVSBCKSRV)
      and finding_info.title : VolumeShadowSnapshot*
      and unmapped.filename = "Veeam.Backup.ManagerGCServer.exe"
  )
  and not (
      device.name = "RRPLSIEMSRV"
      and finding_info.title : "FileSystemTamperFalconSensor*"
      and unmapped.parent_details.%json.filename = "svchost.exe"
  )
  | eval(hour_bucket = math.round(@scnr.time_ns / 3600000000000))
  | stats
      count() as event_count,
      countdistinct(device.name) as affected_hosts,
      countdistinct(finding_info.uid) as unique_alerts
    by ig_tenant_id,
       %ingest.import_rule_name,
       finding_info.title,
       unmapped.severity_name,
       unmapped.tactic,
       unmapped.technique,
       unmapped.scenario,
       unmapped.user_name,
       unmapped.filename,
       unmapped.cmdline,
       unmapped.parent_details.%json.filename,
       unmapped.parent_details.%json.cmdline,
       unmapped.pattern_disposition_description,
       hour_bucket
  | rename(
      finding_info.title as finding_name,
      unmapped.severity_name as falcon_severity,
      unmapped.tactic as mitre_tactic,
      unmapped.technique as mitre_technique,
      unmapped.scenario as scenario,
      unmapped.user_name as username,
      unmapped.filename as process_name,
      unmapped.cmdline as process_cmdline,
      unmapped.parent_details.%json.filename as parent_process,
      unmapped.parent_details.%json.cmdline as parent_cmdline,
      unmapped.pattern_disposition_description as disposition
    )

tags:
  - techniques.universal.crowdstrike_detection

time_range_s: 3600
run_frequency_s: 300

alert_template:
  info:
    - label: "detectionid"
      value: "{{@alert.id}}"
    - label: "incident_type"
      value: "EDR Alert"
    - label: "incident_subtype"
      value: "CrowdStrike Falcon Detection"
    - label: "ruleid"
      value: "{{@alert.detection_rule_id}}"
    - label: "incident_key"
      value: "finding_name"
    - label: "finding_name"
      value: "{{@alert.results_table.rows[0].finding_name}}"

