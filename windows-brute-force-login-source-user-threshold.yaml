# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Windows - Brute Force Login (Source-User Threshold)"
enabled: true
description: |
  Detects classic brute-force login attempts against a single Windows user
  account from a single source. Triggers on Windows Security EventID 4625
  (failed logon) aggregated by the pair (source IP, TargetUserName) within a
  1-hour window when the count of failed attempts is 10 or more. This is the
  same-user-many-passwords pattern - distinct from password-spray (same
  password across many users).

# UC#: 66
# MITRE ATT&CK: T1110.001 - Brute Force: Password Guessing (TA0006 - Credential Access)
# OCSF Class: Authentication (3002)
# Log Source: Windows Security (ocsf_mapped)
# TI Source: Splunk Security Content - https://research.splunk.com/endpoint/9015385a-9c84-11eb-bef2-acde48001122/
# UWS Encyclopedia: https://www.ultimatewindowssecurity.com/securitylog/encyclopedia/event.aspx?eventid=4625
# Existing rule reference (column M / partial overlap):
#   SR#3 'Consecutive Unsuccessful Logins to Same Account from different IPs' covers the
#   same-user-from-many-sources brute-force variant. UC#66 covers the orthogonal axis -
#   same source + same user with high count (the canonical password-guessing pattern).

severity: High
query_text: |
  @index={ 81fe91d5-1dee-4321-8700-0d1c4f441770 | "ocsf_mapped" }
  ig_tenant_id = "c4134177-2fae-4a1a-8bb5-c81e997f78e5"
  metadata.labels[1] = "WINDOWS"
  metadata.event_code = 4625
  src_endpoint.ip = "*"
  not unmapped.StringInserts.%json[5] = "*$"
  not unmapped.StringInserts.%json[5] = "ANONYMOUS LOGON"
  | stats count() as fail_count
    by ig_tenant_id,
       %ingest.import_rule_name,
       src_endpoint.ip,
       unmapped.StringInserts.%json[5]
  | where(fail_count >= 10)
  | rename(src_endpoint.ip as source_ip,
           unmapped.StringInserts.%json[5] as target_user)

tags:
  - techniques.t1110.001.t1110_001

time_range_s: 3600
run_frequency_s: 300
dedup_window_s: 86400
debounce: true
alert_per_row: false

alert_template:
  info:
    - label: "detectionid"
      value: "{{@alert.id}}"
      use_for_dedup: false
    - label: "incident_type"
      value: "Credential Access"
      use_for_dedup: false
    - label: "incident_subtype"
      value: "Brute Force (Same Source-User Threshold)"
      use_for_dedup: false
    - label: "ruleid"
      value: "{{@alert.detection_rule_id}}"
      use_for_dedup: false
    - label: "incident_key"
      value: "target_user"
      use_for_dedup: false
    - label: "target_user"
      value: "{{@alert.results_table.rows[0].target_user}}"
      use_for_dedup: true

