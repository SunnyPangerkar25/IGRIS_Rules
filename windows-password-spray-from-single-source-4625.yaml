# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Windows - Password Spray From Single Source (Initial Access)"
enabled: true
description: |
  Detects password-spray attempts originating from a single source IP against
  many distinct users. Triggers on Windows Security EventID 4625 (failed
  logon) aggregated by source IP within a 1-hour window when the count of
  distinct TargetUserName values is 10 or more. Classic password-spray
  pattern - few passwords tried across many accounts to avoid per-account
  lockout policies.

# UC#: 32
# MITRE ATT&CK: T1110.003 - Brute Force: Password Spraying (TA0006 - Credential Access / TA0001 - Initial Access)
# OCSF Class: Authentication (3002)
# Log Source: Windows Security (ocsf_mapped)
# TI Source: Splunk Security Content - https://research.splunk.com/endpoint/b6391b15-e913-4c2c-8949-9eecc06efacc/
# UWS Encyclopedia: https://www.ultimatewindowssecurity.com/securitylog/encyclopedia/event.aspx?eventid=4625
# Existing rule reference (column M / partial overlap):
#   SR#25 'Multiple Users Fail With Explicit Credentials' covers 4648 / 30-user threshold;
#   SR#27 'Multiple Users Failed NTLM' covers 4776 / 30-user threshold.
#   UC#32 fills the 4625-failed-logon gap with a 10-user threshold, the source-IP-centric
#   spray pattern that SR#25/27 don't cover (those use 4648/4776 EventIDs).

severity: High
query_text: |
  @index={ 81fe91d5-1dee-4321-8700-0d1c4f441770 | "ocsf_mapped" }
  ig_tenant_id = "c4134177-2fae-4a1a-8bb5-c81e997f78e5"
  metadata.labels[1] = "WINDOWS"
  metadata.event_code = 4625
  src_endpoint.ip = "*"
  not unmapped.StringInserts.%json[5] = "*$"
  not unmapped.StringInserts.%json[5] = "ANONYMOUS LOGON"
  | stats
    countdistinct(unmapped.StringInserts.%json[5]) as unique_users,
    count() as total_failures
    by ig_tenant_id, %ingest.import_rule_name, src_endpoint.ip
  | where(unique_users >= 10)
  | rename(src_endpoint.ip as source_ip)

tags:
  - techniques.t1110.003.t1110_003

time_range_s: 3600
run_frequency_s: 300
dedup_window_s: 86400
debounce: true
alert_per_row: false

alert_template:
  info:
    - label: "detectionid"
      value: "{{@alert.id}}"
      use_for_dedup: false
    - label: "incident_type"
      value: "Initial Access"
      use_for_dedup: false
    - label: "incident_subtype"
      value: "Password Spray (Source-Centric)"
      use_for_dedup: false
    - label: "ruleid"
      value: "{{@alert.detection_rule_id}}"
      use_for_dedup: false
    - label: "incident_key"
      value: "source_ip"
      use_for_dedup: false
    - label: "source_ip"
      value: "{{@alert.results_table.rows[0].source_ip}}"
      use_for_dedup: true

tests:
