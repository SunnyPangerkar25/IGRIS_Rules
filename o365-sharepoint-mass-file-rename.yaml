# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Microsoft 365 - SharePoint/OneDrive Mass File Rename (Possible Ransomware Staging)"
enabled: true
description: |
  Detects when a single user renames 50 or more files or folders within a
  one-hour window in SharePoint or OneDrive. Mass rename activity is a
  classic indicator of ransomware encrypting files in place (the encryptor
  renames each file with a new extension), or of an attacker staging data
  for exfiltration by reorganizing it.

  References:
  * https://attack.mitre.org/techniques/T1486/
  * https://attack.mitre.org/techniques/T1565/

# MITRE ATT&CK: T1486 - Data Encrypted for Impact (TA0040 - Impact)
# OCSF Class: File System Activity (1001)
# Log Source: O365 SharePoint/OneDrive (ocsf_mapped)
# Note: Verified 2026-04-08 - FileRenamed/FolderRenamed lands in File System
# Activity 1001 across all 6 tenants. Per-hour bucket flood check at threshold
# 50 produced 1 fire fleet-wide over 4 weeks - excellent signal-to-noise.
severity: High

query_text: |
  @index={ 81fe91d5-1dee-4321-8700-0d1c4f441770 | "ocsf_mapped" }
  metadata.labels[1] = "O365"
  class_uid = 1001
  unmapped.Operation: ("FileRenamed" "FolderRenamed")
  | stats count() as rename_count
    by ig_tenant_id, %ingest.import_rule_name, actor.user.email_addr
  | where(rename_count >= 50)
  | rename(actor.user.email_addr as actor_user)

tags:
  - techniques.t1486.data_encrypted_for_impact

time_range_s: 3600
run_frequency_s: 600

alert_template:
  info:
    - label: "detectionid"
      value: "{{@alert.id}}"
    - label: "incident_type"
      value: "Impact / Ransomware"
    - label: "incident_subtype"
      value: "Mass File Rename - SharePoint/OneDrive (M365)"
    - label: "ruleid"
      value: "{{@alert.detection_rule_id}}"
    - label: "incident_key"
      value: "actor_user"
    - label: "actor_user"
      value: "{{@alert.results_table.rows[0].actor_user}}"

