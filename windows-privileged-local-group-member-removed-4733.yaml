# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Windows - Member Removed from Privileged Local Group (4733)"
enabled: true
description: |
  Detects a member being removed from a high-privilege security-enabled
  domain-local / built-in group (Administrators, Account Operators, Server
  Operators, Backup Operators, or DnsAdmins). Fires on a single occurrence.
  Removal can be legitimate administration or an attempt to cover tracks or
  disrupt response, so privileged-group removals warrant review.

# MITRE ATT&CK: T1098 - Account Manipulation (TA0003 - Persistence, TA0004 - Privilege Escalation)
# MITRE ATT&CK: T1531 - Account Access Removal (TA0040 - Impact)
# OCSF Class: Base Event (0) - unmapped Windows feed
# Log Source: Windows Security (ocsf_mapped, raw_data.%json.* feed)
# TI Source: Build from data + Microsoft Security Auditing schema (UWS Encyclopedia)
# Reference: https://www.ultimatewindowssecurity.com/securitylog/encyclopedia/event.aspx?eventid=4733
#
# Event 4733 = member removed from a security-enabled LOCAL group.
# Critical local/builtin groups:
#   S-1-5-32-544 Administrators | S-1-5-32-548 Account Operators
#   S-1-5-32-549 Server Operators | S-1-5-32-551 Backup Operators
#   DnsAdmins matched by name (created group, variable RID - no fixed SID)
# Field positions (raw_data.%json.StringInserts) - 472x/475x family:
#   [0]=MemberName(DN)  [1]=MemberSid  [2]=TargetGroupName  [3]=TargetDomainName
#   [4]=TargetGroupSid  [5]=SubjectUserSid  [6]=SubjectUserName(performed_by)  (verified: [2]=group, [4]=SID)
#
# Flood Check: 4-week baseline = 4 events (Account Operators). Near-silent, high-signal.
# Per-rule exceptions: add `and not (...)` clauses to the filter block for authorized accounts.
#
# raw_field_rule: true
# raw_category: B
# justification: Windows EventID 4733 arrives as Base Event in the current Windows OCSF mapping; EventID, target group name and group SID are only available via raw_data.%json paths
# affected_event_types: windows.4733
# migration_target: Entity Management / Group Management - if Windows gains full OCSF support
severity: Critical
query_text: |
  @index={ 81fe91d5-1dee-4321-8700-0d1c4f441770 | "ocsf_mapped" }
  ig_tenant_id = "c4134177-2fae-4a1a-8bb5-c81e997f78e5"
  metadata.labels[1] = "WINDOWS"
  raw_data.%json.EventID = 4733
  (raw_data.%json.StringInserts[4] = "S-1-5-32-544" or
   raw_data.%json.StringInserts[4] = "S-1-5-32-548" or
   raw_data.%json.StringInserts[4] = "S-1-5-32-549" or
   raw_data.%json.StringInserts[4] = "S-1-5-32-551" or
   raw_data.%json.StringInserts[2] = "DnsAdmins")
  | stats count() as event_count
    by ig_tenant_id,
       %ingest.import_rule_name,
       raw_data.%json.Computer,
       raw_data.%json.StringInserts[2],
       raw_data.%json.StringInserts[4],
       raw_data.%json.StringInserts[0],
       raw_data.%json.StringInserts[6]
  | where(event_count >= 1)
  | rename(raw_data.%json.Computer as hostname,
           raw_data.%json.StringInserts[2] as group_name,
           raw_data.%json.StringInserts[4] as group_sid,
           raw_data.%json.StringInserts[0] as member,
           raw_data.%json.StringInserts[6] as performed_by)

tags:
  - techniques.t1098.t1098

time_range_s: 3600
run_frequency_s: 300
dedup_window_s: 3600
debounce: true
alert_per_row: false

alert_template:
  info:
    - label: "detectionid"
      value: "{{@alert.id}}"
      use_for_dedup: false
    - label: "incident_type"
      value: "Privilege Escalation"
      use_for_dedup: false
    - label: "incident_subtype"
      value: "Member Removed from Privileged Local Group"
      use_for_dedup: false
    - label: "ruleid"
      value: "{{@alert.detection_rule_id}}"
      use_for_dedup: false
    - label: "incident_key"
      value: "member"
      use_for_dedup: false
    - label: "member"
      value: "{{@alert.results_table.rows[0].member}}"
      use_for_dedup: true

tests:
  - name: "Positive - member removed from Account Operators (4733, S-1-5-32-548)"
    now_timestamp: "2026-06-03T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-06-03T12:01:00.000Z","metadata.labels[1]":"WINDOWS","raw_data.%json.EventID":4733,"raw_data.%json.Computer":"DC01.example.local","raw_data.%json.StringInserts[0]":"CN=Jane Doe,OU=Users,DC=example,DC=local","raw_data.%json.StringInserts[1]":"S-1-5-21-264163316-3204977826-1206970977-1106","raw_data.%json.StringInserts[2]":"Account Operators","raw_data.%json.StringInserts[3]":"Builtin","raw_data.%json.StringInserts[4]":"S-1-5-32-548","raw_data.%json.StringInserts[6]":"admin.user","ig_tenant_id":"c4134177-2fae-4a1a-8bb5-c81e997f78e5","%ingest.import_rule_name":"base_event"}
    expected_detection_result: true

  - name: "Negative - member removed from non-critical local group (custom RID)"
    now_timestamp: "2026-06-03T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-06-03T12:02:00.000Z","metadata.labels[1]":"WINDOWS","raw_data.%json.EventID":4733,"raw_data.%json.Computer":"DC01.example.local","raw_data.%json.StringInserts[0]":"CN=Normal User,OU=Users,DC=example,DC=local","raw_data.%json.StringInserts[1]":"S-1-5-21-264163316-3204977826-1206970977-1500","raw_data.%json.StringInserts[2]":"Marketing","raw_data.%json.StringInserts[3]":"EXAMPLE","raw_data.%json.StringInserts[4]":"S-1-5-21-264163316-3204977826-1206970977-9093","raw_data.%json.StringInserts[6]":"hr.user","ig_tenant_id":"c4134177-2fae-4a1a-8bb5-c81e997f78e5","%ingest.import_rule_name":"base_event"}
    expected_detection_result: false
