# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Barracuda EGD - Domain Impersonation Alert"
enabled: true
description: |
  Detects any email classified as domain_impersonation by Barracuda EGD. This is
  rare and extremely high-signal — Barracuda flagged the sender as spoofing or
  visually impersonating a trusted domain (typosquatting, cousin domain, header forgery).

# TI Source: Build from data. Intent adapted from Elastic "Threat Intel Email Indicator Match".
# Flood Check: PASS (1 event Aerizome, 0 Kedaara, 4w window 2026-03-13 to 2026-04-10).
# References:
#   - MITRE ATT&CK T1566.003 - Phishing: Spearphishing via Service (TA0001)
#   - Barracuda EGD schema: Knowledge_Base/Schema/Barracuda_EGD_schema.md
severity: Critical
query_text: |
  @index={ 81fe91d5-1dee-4321-8700-0d1c4f441770 | "ocsf_mapped" }
    metadata.labels[1]="BARRACUDA" class_name="Email Activity"
    unmapped.barracuda.%json.payload.recipients[0].taxonomy="domain_impersonation"
  | stats count() as event_count
      by ig_tenant_id, %ingest.import_rule_name, src_endpoint.ip,
         unmapped.barracuda.%json.payload.hdr_from,
         unmapped.barracuda.%json.payload.hdr_to,
         unmapped.barracuda.%json.payload.recipients[0].action,
         unmapped.barracuda.%json.payload.recipients[0].reason
  | where(event_count >= 1)
  | rename(unmapped.barracuda.%json.payload.hdr_from as sender,
           unmapped.barracuda.%json.payload.hdr_to as recipient,
           unmapped.barracuda.%json.payload.recipients[0].action as action,
           unmapped.barracuda.%json.payload.recipients[0].reason as reason,
           src_endpoint.ip as source_ip)

tags:
  - techniques.t1566_003.phishing_via_service

time_range_s: 3600
run_frequency_s: 300

alert_template:
  info:
    - label: "detectionid"
      value: "{{@alert.id}}"
    - label: "incident_type"
      value: "Email Threat"
    - label: "incident_subtype"
      value: "Domain Impersonation"
    - label: "ruleid"
      value: "{{@alert.detection_rule_id}}"
    - label: "incident_key"
      value: "sender"
    - label: "key_entity"
      value: "{{sender}}"

tests:
  - name: "Positive - domain impersonation detected"
    now_timestamp: "2026-04-08T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-04-08T12:01:00.000Z","metadata.labels[1]":"BARRACUDA","class_name":"Email Activity","unmapped.barracuda.%json.payload.recipients[0].taxonomy":"domain_impersonation","unmapped.barracuda.%json.payload.recipients[0].action":"quarantined","unmapped.barracuda.%json.payload.recipients[0].reason":"spf","unmapped.barracuda.%json.payload.hdr_from":"ceo@aer1zome.com","unmapped.barracuda.%json.payload.hdr_to":"finance@aerizome.com","src_endpoint.ip":"45.33.32.156","ig_tenant_id":"test-tenant","%ingest.import_rule_name":"email_activity"}
    expected_detection_result: true

  - name: "Negative - phishing taxonomy (not domain impersonation)"
    now_timestamp: "2026-04-08T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-04-08T12:01:00.000Z","metadata.labels[1]":"BARRACUDA","class_name":"Email Activity","unmapped.barracuda.%json.payload.recipients[0].taxonomy":"phishing","unmapped.barracuda.%json.payload.recipients[0].action":"blocked","unmapped.barracuda.%json.payload.recipients[0].reason":"taxonomy_phishing","unmapped.barracuda.%json.payload.hdr_from":"spam@evil.com","unmapped.barracuda.%json.payload.hdr_to":"user@corp.com","src_endpoint.ip":"192.168.1.1","ig_tenant_id":"test-tenant","%ingest.import_rule_name":"email_activity"}
    expected_detection_result: false
