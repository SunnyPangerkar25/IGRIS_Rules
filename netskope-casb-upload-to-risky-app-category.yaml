# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Netskope CASB - Upload to Risky App / Category (GenAI, Webmail, Messaging, File Transfer)"
enabled: true
description: |
  Detects file uploads to risky cloud application categories (Generative AI,
  personal webmail, chat/IM, file converters, e-commerce, file-transfer tools)
  where either the activity is sustained (>=10 uploads AND >=1 MB in 1 hour)
  or a single large transfer occurs (>=100 MB regardless of file count).

  Targets the real-world exfiltration surface for this environment: ChatGPT,
  Claude, Gemini, Google NotebookLM, Yahoo Mail, WhatsApp, WeTransfer,
  Dropbox, Box, Mega, pCloud, AnonFiles, iLovePDF, etc. WPS Office is
  explicitly excluded because it emits low-byte autosave telemetry that
  Netskope classifies under "Collaboration / poor CCL" but is not a user
  file-share action.

  References:
  * https://attack.mitre.org/techniques/T1567/002/ (Exfiltration to Cloud Storage)
  * Netskope Cloud Confidence Index — app risk classification

# MITRE ATT&CK: T1567.002 - Exfiltration to Cloud Storage (TA0010 - Exfiltration)
# OCSF Class: File Hosting Activity (6006)
# Log Source: Netskope SASE/CASB (ocsf_mapped)
# Note: App/category exclude-list tuned against 7-day cross-tenant flood check
#       (2026-04-09). Uses unmapped.appcategory + actor.app_name for selection;
#       unmapped.* fields are populated under ocsf_mapped Base Event passthrough
#       and confirmed available for all 3 Netskope-emitting tenants.
severity: High
query_text: |
  @index={ 81fe91d5-1dee-4321-8700-0d1c4f441770 | "ocsf_mapped" }
  metadata.labels[1]="NETSKOPE"
  class_name="File Hosting Activity"
  activity_name="Upload"
  (unmapped.appcategory: ("Generative AI" "Chat, IM & other communication" "File Converter" "News & Media" "E-Commerce Tools") or actor.app_name: ("WeTransfer" "WhatsApp" "Yahoo Mail" "Dropbox" "Box" "Mega" "pCloud" "AnonFiles"))
  not unmapped.appcategory="Global_Whitelist"
  not actor.app_name="WPS Office"
  | stats
      count() as upload_count,
      sum(file.size) as bytes_uploaded,
      countdistinct(file.name) as distinct_files
    by ig_tenant_id, %ingest.import_rule_name, actor.user.name, actor.app_name, unmapped.appcategory, unmapped.ccl
  | where((upload_count >= 10 and bytes_uploaded >= 1048576) or bytes_uploaded >= 104857600)
  | rename(actor.user.name as username, actor.app_name as cloud_app, unmapped.appcategory as app_category, unmapped.ccl as cloud_confidence_level)

tags:
  - techniques.t1567.002.exfiltration_to_cloud_storage

time_range_s: 3600
run_frequency_s: 300

alert_template:
  info:
    - label: "detectionid"
      value: "{{@alert.id}}"
    - label: "incident_type"
      value: "Data Exfiltration"
    - label: "incident_subtype"
      value: "Upload to Risky Cloud App / Category"
    - label: "ruleid"
      value: "{{@alert.detection_rule_id}}"
    - label: "incident_key"
      value: "username"
    - label: "username"
      value: "{{@alert.results_table.rows[0].username}}"

tests:
  - name: "Positive - user uploads 150 MB single file to ChatGPT"
    now_timestamp: "2026-04-09T13:00:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-04-09T12:10:00.000Z","metadata.labels[1]":"NETSKOPE","class_name":"File Hosting Activity","activity_name":"Upload","actor.user.name":"alice@corp.com","actor.app_name":"ChatGPT","file.name":"customer-data.csv","file.size":157286400,"unmapped.appcategory":"Generative AI","unmapped.ccl":"low","ig_tenant_id":"test-tenant","%ingest.import_rule_name":"base_event"}
    expected_detection_result: true

  - name: "Negative - small single upload below both thresholds"
    now_timestamp: "2026-04-09T13:00:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-04-09T12:10:00.000Z","metadata.labels[1]":"NETSKOPE","class_name":"File Hosting Activity","activity_name":"Upload","actor.user.name":"bob@corp.com","actor.app_name":"ChatGPT","file.name":"note.txt","file.size":4096,"unmapped.appcategory":"Generative AI","unmapped.ccl":"low","ig_tenant_id":"test-tenant","%ingest.import_rule_name":"base_event"}
    expected_detection_result: false

  - name: "Negative - upload to non-risky category (not in selector)"
    now_timestamp: "2026-04-09T13:00:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-04-09T12:10:00.000Z","metadata.labels[1]":"NETSKOPE","class_name":"File Hosting Activity","activity_name":"Upload","actor.user.name":"charlie@corp.com","actor.app_name":"Microsoft Office 365 OneDrive for Business","file.name":"project.zip","file.size":52428800,"unmapped.appcategory":"Collaboration","unmapped.ccl":"high","ig_tenant_id":"test-tenant","%ingest.import_rule_name":"base_event"}
    expected_detection_result: false
