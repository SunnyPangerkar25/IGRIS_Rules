# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Windows - Pass-the-Hash NTLM Logon Signature"
enabled: true
description: |
  Detects Pass-the-Hash (PtH) authentication via the canonical NTLM signature in
  Windows Security EventID 4624. Triggers on either of two patterns: (a) Network
  logon (LogonType=3) using NTLM with KeyLength=0 and a NULL SubjectUserSid
  (S-1-0-0) - characteristic of Mimikatz/Impacket-style hash relay; or
  (b) NewCredentials logon (LogonType=9) via the seclogo logon process
  (RunAs /netonly with stolen NTLM hash) - the high-fidelity Mimikatz
  sekurlsa::pth signature. Both patterns exclude machine accounts
  (TargetUserName ending in $) and the built-in ANONYMOUS LOGON
  pseudo-account.

# UC#: 37
# MITRE ATT&CK: T1550.002 - Use Alternate Authentication Material: Pass the Hash (TA0008 - Lateral Movement)
# OCSF Class: Authentication (3002)
# Log Source: Windows Security (ocsf_mapped)
# TI Source: SigmaHQ - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/account_management/win_security_pass_the_hash_2.yml
# UWS Encyclopedia: https://www.ultimatewindowssecurity.com/securitylog/encyclopedia/event.aspx?eventid=4624
# Field positions verified live:
#   [0]=SubjectUserSid (S-1-0-0 for PtH network logon), [5]=TargetUserName,
#   [8]=LogonType (also available as mapped field logon_type_id),
#   [9]=LogonProcessName ("NtLmSsp " with trailing space - use token match),
#   [10]=AuthenticationPackageName, [11]=WorkstationName, [14]=PackageName,
#   [15]=KeyLength (0 for PtH NTLM relay), [18]=IpAddress (also src_endpoint.hostname)

severity: High
query_text: |
  @index={ 81fe91d5-1dee-4321-8700-0d1c4f441770 | "ocsf_mapped" }
  ig_tenant_id = "c4134177-2fae-4a1a-8bb5-c81e997f78e5"
  metadata.labels[1] = "WINDOWS"
  metadata.event_code = 4624
  ((unmapped.StringInserts.%json[0] = "S-1-0-0" AND
    logon_type_id = 3 AND
    unmapped.StringInserts.%json[9]: "NtLmSsp" AND
    unmapped.StringInserts.%json[15] = 0 AND
    not unmapped.StringInserts.%json[5] = "*$" AND
    not unmapped.StringInserts.%json[5] = "ANONYMOUS LOGON")
   OR
   (logon_type_id = 9 AND
    unmapped.StringInserts.%json[9]: "seclogo" AND
    not unmapped.StringInserts.%json[5] = "*$" AND
    not unmapped.StringInserts.%json[5] = "ANONYMOUS LOGON"))
  | stats count() as event_count
    by ig_tenant_id,
       %ingest.import_rule_name,
       src_endpoint.hostname,
       unmapped.StringInserts.%json[0],
       unmapped.StringInserts.%json[5],
       unmapped.StringInserts.%json[9],
       unmapped.StringInserts.%json[11],
       unmapped.StringInserts.%json[15],
       logon_type_id
  | where(event_count >= 1)
  | rename(src_endpoint.hostname as source_ip,
           unmapped.StringInserts.%json[0] as subject_user_sid,
           unmapped.StringInserts.%json[5] as target_user,
           unmapped.StringInserts.%json[9] as logon_process,
           unmapped.StringInserts.%json[11] as workstation_name,
           unmapped.StringInserts.%json[15] as key_length,
           logon_type_id as logon_type)

tags:
  - techniques.t1550.002.t1550_002

time_range_s: 3600
run_frequency_s: 300
dedup_window_s: 86400
debounce: true
alert_per_row: false

alert_template:
  info:
    - label: "detectionid"
      value: "{{@alert.id}}"
      use_for_dedup: false
    - label: "incident_type"
      value: "Lateral Movement"
      use_for_dedup: false
    - label: "incident_subtype"
      value: "Pass-the-Hash"
      use_for_dedup: false
    - label: "ruleid"
      value: "{{@alert.detection_rule_id}}"
      use_for_dedup: false
    - label: "incident_key"
      value: "target_user"
      use_for_dedup: false
    - label: "target_user"
      value: "{{@alert.results_table.rows[0].target_user}}"
      use_for_dedup: true

tests:
  - name: "Positive - PtH pattern A: NULL SID, LogonType=3, NtLmSsp, KeyLength=0"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:01:00.000Z","metadata.labels[1]":"WINDOWS","metadata.event_code":4624,"logon_type_id":3,"src_endpoint.hostname":"172.16.130.17","unmapped.StringInserts.%json[0]":"S-1-0-0","unmapped.StringInserts.%json[5]":"jdoe","unmapped.StringInserts.%json[8]":3,"unmapped.StringInserts.%json[9]":"NtLmSsp ","unmapped.StringInserts.%json[10]":"NTLM","unmapped.StringInserts.%json[11]":"ATTACKER-PC","unmapped.StringInserts.%json[14]":"NTLM V2","unmapped.StringInserts.%json[15]":0,"unmapped.StringInserts.%json[18]":"172.16.130.17","ig_tenant_id":"c4134177-2fae-4a1a-8bb5-c81e997f78e5","%ingest.import_rule_name":"authentication"}
    expected_detection_result: true

  - name: "Positive - PtH pattern B: LogonType=9 (NewCredentials), seclogo process"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:02:00.000Z","metadata.labels[1]":"WINDOWS","metadata.event_code":4624,"logon_type_id":9,"src_endpoint.hostname":"127.0.0.1","unmapped.StringInserts.%json[0]":"S-1-5-21-12345-67890-1234","unmapped.StringInserts.%json[5]":"attacker","unmapped.StringInserts.%json[8]":9,"unmapped.StringInserts.%json[9]":"seclogo ","unmapped.StringInserts.%json[10]":"Negotiate","unmapped.StringInserts.%json[11]":"ATTACKER-PC","unmapped.StringInserts.%json[14]":"-","unmapped.StringInserts.%json[15]":0,"ig_tenant_id":"c4134177-2fae-4a1a-8bb5-c81e997f78e5","%ingest.import_rule_name":"authentication"}
    expected_detection_result: true

  - name: "Negative - Normal NTLM Network logon with proper KeyLength (128)"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:01:00.000Z","metadata.labels[1]":"WINDOWS","metadata.event_code":4624,"logon_type_id":3,"src_endpoint.hostname":"172.16.130.17","unmapped.StringInserts.%json[0]":"S-1-0-0","unmapped.StringInserts.%json[5]":"RRLCKL4495$","unmapped.StringInserts.%json[8]":3,"unmapped.StringInserts.%json[9]":"NtLmSsp ","unmapped.StringInserts.%json[10]":"NTLM","unmapped.StringInserts.%json[11]":"RRLCKL4495","unmapped.StringInserts.%json[14]":"NTLM V2","unmapped.StringInserts.%json[15]":128,"unmapped.StringInserts.%json[18]":"172.16.130.17","ig_tenant_id":"c4134177-2fae-4a1a-8bb5-c81e997f78e5","%ingest.import_rule_name":"authentication"}
    expected_detection_result: false

  - name: "Negative - Kerberos logon (LogonType=3 but not NtLmSsp)"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:01:00.000Z","metadata.labels[1]":"WINDOWS","metadata.event_code":4624,"logon_type_id":3,"src_endpoint.hostname":"172.16.130.17","unmapped.StringInserts.%json[0]":"S-1-5-21-12345","unmapped.StringInserts.%json[5]":"jdoe","unmapped.StringInserts.%json[8]":3,"unmapped.StringInserts.%json[9]":"Kerberos","unmapped.StringInserts.%json[10]":"Kerberos","unmapped.StringInserts.%json[11]":"CORP-DC01","unmapped.StringInserts.%json[14]":"-","unmapped.StringInserts.%json[15]":0,"unmapped.StringInserts.%json[18]":"172.16.130.17","ig_tenant_id":"c4134177-2fae-4a1a-8bb5-c81e997f78e5","%ingest.import_rule_name":"authentication"}
    expected_detection_result: false

  - name: "Negative - LogonType=2 Interactive (not Pass-the-Hash)"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:01:00.000Z","metadata.labels[1]":"WINDOWS","metadata.event_code":4624,"logon_type_id":2,"src_endpoint.hostname":"172.16.130.17","unmapped.StringInserts.%json[0]":"S-1-5-21-12345","unmapped.StringInserts.%json[5]":"jdoe","unmapped.StringInserts.%json[8]":2,"unmapped.StringInserts.%json[9]":"User32  ","unmapped.StringInserts.%json[10]":"Negotiate","unmapped.StringInserts.%json[11]":"DESKTOP","unmapped.StringInserts.%json[14]":"-","unmapped.StringInserts.%json[15]":0,"ig_tenant_id":"c4134177-2fae-4a1a-8bb5-c81e997f78e5","%ingest.import_rule_name":"authentication"}
    expected_detection_result: false
