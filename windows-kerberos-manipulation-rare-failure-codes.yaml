# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Windows - Kerberos Manipulation (Rare TGT Failure Codes)"
enabled: true
description: |
  Detects Kerberos protocol manipulation via rare cryptographic/replay failure
  result codes on TGT requests. Triggers on Windows Security EventID 4768
  (Kerberos TGT requested) where the Result Code is one of the
  manipulation-specific values: 0x9 (integrity check failed), 0xA (cannot
  postdate), 0xB (never valid), 0x10 (ticket not yet valid), 0x22 (replay),
  0x27 (bad key version), 0x2A (message stream modified), 0x44 (discarded
  duplicate). These codes are emitted when the KDC detects malformed,
  replayed, or stream-modified Kerberos messages - rare in normal operation,
  characteristic of PetitPotam, NTLM relay, ticket-injection and other
  Kerberos-tampering attack chains. Routine failure codes (password expired
  0x17, bad password 0x18, ticket expired 0x20, clock skew 0x25, pre-auth
  required 0x3E-0x41) are intentionally excluded as operational noise.

# UC#: 7
# MITRE ATT&CK: T1212 - Exploitation for Credential Access (TA0006)
# OCSF Class: Authentication (3002)
# Log Source: Windows Security (ocsf_mapped)
# TI Source: SigmaHQ - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_susp_kerberos_manipulation.yml
# UWS Encyclopedia: https://www.ultimatewindowssecurity.com/securitylog/encyclopedia/event.aspx?eventid=4768
# Field positions verified live:
#   [0]=TargetUserName, [1]=TargetDomainName, [2]=UserSid, [3]=ServiceName,
#   [4]=ServiceSid, [5]=TicketOptions, [6]=ResultCode (THIS IS THE FILTER FIELD),
#   [7]=TicketEncryptionType, [8]=PreAuthType, [9]=ClientAddress, [10]=ClientPort
# Note: Sigma rule also covers 4769 and 4771 - those use different field paths
# (4769 is raw_data, 4771 OCSF-mapped with different positions) and are
# addressed by sister rules (Kerberoasting/UC#69 for 4769 manipulation).

severity: High
query_text: |
  @index={ 81fe91d5-1dee-4321-8700-0d1c4f441770 | "ocsf_mapped" }
  metadata.labels[1] = "WINDOWS"
  metadata.event_code = 4768
  (unmapped.StringInserts.%json[6] = "0x9" or
   unmapped.StringInserts.%json[6] = "0xA" or
   unmapped.StringInserts.%json[6] = "0xB" or
   unmapped.StringInserts.%json[6] = "0x10" or
   unmapped.StringInserts.%json[6] = "0x22" or
   unmapped.StringInserts.%json[6] = "0x27" or
   unmapped.StringInserts.%json[6] = "0x2A" or
   unmapped.StringInserts.%json[6] = "0x44")
  | stats count() as event_count
    by ig_tenant_id,
       %ingest.import_rule_name,
       src_endpoint.ip,
       unmapped.StringInserts.%json[0],
       unmapped.StringInserts.%json[3],
       unmapped.StringInserts.%json[6]
  | where(event_count >= 1)
  | rename(src_endpoint.ip as source_ip,
           unmapped.StringInserts.%json[0] as target_user,
           unmapped.StringInserts.%json[3] as service_name,
           unmapped.StringInserts.%json[6] as result_code)

tags:
  - techniques.t1212.t1212

time_range_s: 3600
run_frequency_s: 300
dedup_window_s: 86400
debounce: true
alert_per_row: false

alert_template:
  info:
    - label: "detectionid"
      value: "{{@alert.id}}"
      use_for_dedup: false
    - label: "incident_type"
      value: "Credential Access"
      use_for_dedup: false
    - label: "incident_subtype"
      value: "Kerberos Protocol Manipulation"
      use_for_dedup: false
    - label: "ruleid"
      value: "{{@alert.detection_rule_id}}"
      use_for_dedup: false
    - label: "incident_key"
      value: "target_user"
      use_for_dedup: false
    - label: "target_user"
      value: "{{@alert.results_table.rows[0].target_user}}"
      use_for_dedup: true

tests:
  - name: "Positive - 4768 with replay (0x22) result code"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:01:00.000Z","metadata.labels[1]":"WINDOWS","metadata.event_code":4768,"src_endpoint.ip":"172.16.110.31","unmapped.StringInserts.%json[0]":"attacker","unmapped.StringInserts.%json[1]":"CORP.LOCAL","unmapped.StringInserts.%json[3]":"krbtgt","unmapped.StringInserts.%json[5]":"0x40810010","unmapped.StringInserts.%json[6]":"0x22","unmapped.StringInserts.%json[7]":"0x12","unmapped.StringInserts.%json[8]":2,"unmapped.StringInserts.%json[9]":"172.16.110.31","ig_tenant_id":"test-tenant","%ingest.import_rule_name":"authentication"}
    expected_detection_result: true

  - name: "Positive - 4768 with message-modified (0x2A) result code"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:02:00.000Z","metadata.labels[1]":"WINDOWS","metadata.event_code":4768,"src_endpoint.ip":"172.16.110.32","unmapped.StringInserts.%json[0]":"attacker2","unmapped.StringInserts.%json[1]":"CORP.LOCAL","unmapped.StringInserts.%json[3]":"krbtgt","unmapped.StringInserts.%json[5]":"0x40810010","unmapped.StringInserts.%json[6]":"0x2A","unmapped.StringInserts.%json[7]":"0x12","unmapped.StringInserts.%json[8]":2,"unmapped.StringInserts.%json[9]":"172.16.110.32","ig_tenant_id":"test-tenant","%ingest.import_rule_name":"authentication"}
    expected_detection_result: true

  - name: "Negative - 4768 success (result code 0x0)"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:01:00.000Z","metadata.labels[1]":"WINDOWS","metadata.event_code":4768,"src_endpoint.ip":"172.16.110.31","unmapped.StringInserts.%json[0]":"jdoe","unmapped.StringInserts.%json[1]":"CORP.LOCAL","unmapped.StringInserts.%json[3]":"krbtgt","unmapped.StringInserts.%json[5]":"0x40810010","unmapped.StringInserts.%json[6]":"0x0","unmapped.StringInserts.%json[7]":"0x12","unmapped.StringInserts.%json[8]":2,"unmapped.StringInserts.%json[9]":"172.16.110.31","ig_tenant_id":"test-tenant","%ingest.import_rule_name":"authentication"}
    expected_detection_result: false

  - name: "Negative - 4768 user-not-found (0x6, common typo not manipulation)"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:01:00.000Z","metadata.labels[1]":"WINDOWS","metadata.event_code":4768,"src_endpoint.ip":"172.16.110.31","unmapped.StringInserts.%json[0]":"typouser","unmapped.StringInserts.%json[1]":"CORP.LOCAL","unmapped.StringInserts.%json[3]":"krbtgt","unmapped.StringInserts.%json[5]":"0x40810010","unmapped.StringInserts.%json[6]":"0x6","unmapped.StringInserts.%json[7]":"0x12","unmapped.StringInserts.%json[8]":2,"unmapped.StringInserts.%json[9]":"172.16.110.31","ig_tenant_id":"test-tenant","%ingest.import_rule_name":"authentication"}
    expected_detection_result: false
