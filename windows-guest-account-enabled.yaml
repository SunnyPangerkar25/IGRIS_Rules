# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: "Windows - Built-in Guest Account Enabled"
enabled: true
description: |
  Detects the built-in Guest account being enabled on a Windows host or domain.
  Triggers on Windows Security EventID 4722 (a user account was enabled) where
  TargetUserName equals 'Guest' or TargetSid ends with '-501' (the well-known RID
  for the built-in Guest account). The Guest account is disabled by default;
  enabling it provides an unaudited authentication path commonly abused for
  initial access and persistence.

# UC#: 30
# MITRE ATT&CK: T1078.001 - Default Accounts (TA0001 - Initial Access)
# OCSF Class: Account Change
# Log Source: Windows Security (ocsf_mapped)
# TI Source: Microsoft EventID 4722 documentation + well-known Guest RID (-501)
# Reference: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4722
# Field positions verified live:
#   [0]=TargetUserName, [1]=TargetDomainName, [2]=TargetSid,
#   [3]=SubjectUserSid, [4]=SubjectUserName, [5]=SubjectDomainName, [6]=SubjectLogonId

severity: High
query_text: |
  @index={ 81fe91d5-1dee-4321-8700-0d1c4f441770 | "ocsf_mapped" }
  metadata.labels[1] = "WINDOWS"
  metadata.event_code = 4722
  (unmapped.StringInserts.%json[0] = "Guest" or
   unmapped.StringInserts.%json[2] = "*-501")
  | stats count() as event_count
    by ig_tenant_id,
       %ingest.import_rule_name,
       actor.user.name,
       unmapped.StringInserts.%json[0],
       unmapped.StringInserts.%json[2]
  | where(event_count >= 1)
  | rename(actor.user.name as enabled_by,
           unmapped.StringInserts.%json[0] as target_user,
           unmapped.StringInserts.%json[2] as target_sid)

tags:
  - techniques.t1078.001.t1078_001

time_range_s: 3600
run_frequency_s: 300
dedup_window_s: 86400
debounce: true
alert_per_row: false

alert_template:
  info:
    - label: "detectionid"
      value: "{{@alert.id}}"
      use_for_dedup: false
    - label: "incident_type"
      value: "Initial Access"
      use_for_dedup: false
    - label: "incident_subtype"
      value: "Guest Account Enabled"
      use_for_dedup: false
    - label: "ruleid"
      value: "{{@alert.detection_rule_id}}"
      use_for_dedup: false
    - label: "incident_key"
      value: "target_user"
      use_for_dedup: false
    - label: "target_user"
      value: "{{@alert.results_table.rows[0].target_user}}"
      use_for_dedup: true

tests:
  - name: "Positive - Guest account enabled by TargetUserName match"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:01:00.000Z","metadata.labels[1]":"WINDOWS","metadata.event_code":4722,"actor.user.name":"Administrator","unmapped.StringInserts.%json[0]":"Guest","unmapped.StringInserts.%json[1]":"CORP","unmapped.StringInserts.%json[2]":"S-1-5-21-12345-67890-501","unmapped.StringInserts.%json[3]":"S-1-5-21-12345-67890-500","unmapped.StringInserts.%json[4]":"Administrator","unmapped.StringInserts.%json[5]":"CORP","unmapped.StringInserts.%json[6]":"0x12345","ig_tenant_id":"test-tenant","%ingest.import_rule_name":"base_event"}
    expected_detection_result: true

  - name: "Positive - Guest enabled detected via TargetSid -501 (renamed Guest)"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:02:00.000Z","metadata.labels[1]":"WINDOWS","metadata.event_code":4722,"actor.user.name":"Administrator","unmapped.StringInserts.%json[0]":"Visitor","unmapped.StringInserts.%json[1]":"CORP","unmapped.StringInserts.%json[2]":"S-1-5-21-99999-88888-501","unmapped.StringInserts.%json[3]":"S-1-5-21-99999-88888-500","unmapped.StringInserts.%json[4]":"Administrator","unmapped.StringInserts.%json[5]":"CORP","unmapped.StringInserts.%json[6]":"0x67890","ig_tenant_id":"test-tenant","%ingest.import_rule_name":"base_event"}
    expected_detection_result: true

  - name: "Negative - Normal user account enabled (not Guest)"
    now_timestamp: "2026-05-13T12:15:00.000Z"
    dataset_inline: |
      {"timestamp":"2026-05-13T12:01:00.000Z","metadata.labels[1]":"WINDOWS","metadata.event_code":4722,"actor.user.name":"Administrator","unmapped.StringInserts.%json[0]":"jdoe","unmapped.StringInserts.%json[1]":"CORP","unmapped.StringInserts.%json[2]":"S-1-5-21-12345-67890-1234","unmapped.StringInserts.%json[3]":"S-1-5-21-12345-67890-500","unmapped.StringInserts.%json[4]":"Administrator","unmapped.StringInserts.%json[5]":"CORP","unmapped.StringInserts.%json[6]":"0x12345","ig_tenant_id":"test-tenant","%ingest.import_rule_name":"base_event"}
    expected_detection_result: false
